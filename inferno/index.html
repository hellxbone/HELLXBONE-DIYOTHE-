<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#160408"><title>HELLXBONE INFERNO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160408;color:white;font-family:system-ui,Arial}canvas{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;z-index:2;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px;pointer-events:none;text-shadow:0 2px 7px #000}h1{margin:0;font-size:clamp(21px,5vw,32px);line-height:1;color:#ff6234;letter-spacing:2px}small{display:block;color:#ffd0bb;font-size:11px;margin-top:4px}#score{text-align:right;font-size:clamp(21px,6vw,34px);font-weight:900}#score small{font-size:12px}
#panel{position:fixed;z-index:2;bottom:18px;left:50%;transform:translateX(-50%);width:min(94%,470px);background:#1d0710e8;border:1px solid #fd6839;border-radius:20px;padding:14px 16px;text-align:center;box-shadow:0 0 30px #e5243266}#status{font-weight:900;font-size:17px}#hint{margin-top:5px;font-size:13px;color:#ffe0d2}#meter{height:12px;border-radius:8px;background:#4b1b21;overflow:hidden;margin:12px 0}#fill{height:100%;width:0;background:linear-gradient(90deg,#ffd958,#ff3b18)}button{border:0;border-radius:12px;padding:13px 20px;color:white;background:linear-gradient(120deg,#ff8b25,#d40d36);font:900 17px system-ui;touch-action:none;user-select:none}#note{position:fixed;right:8px;bottom:3px;color:#ffffff80;font-size:9px}
</style></head><body>
<div id="hud"><div><h1>HELLXBONE<br>INFERNO</h1><small>LE GRAND LANCER INFERNAL</small></div><div id="score">0 m<small>RECORD : <span id="best">0</span> m</small></div></div>
<div id="panel"><div id="status">PRÊT À ENVOYER LE DÉMON ?</div><div id="hint">Maintiens le bouton pour charger, relâche pour lancer !</div><div id="meter"><div id="fill"></div></div><button id="launch">MAINTIENS POUR LANCER</button></div><div id="note">Prototype 3D • HELLXBONE</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#190409');scene.fog=new THREE.FogExp2('#22050a',.012);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1100);camera.position.set(-12,8,20);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffa781,0x220008,2));const sun=new THREE.DirectionalLight(0xffbd7c,3);sun.position.set(-10,28,18);sun.castShadow=true;scene.add(sun);const glow=new THREE.PointLight(0xff3207,95,75);glow.position.set(0,5,-9);scene.add(glow);
const rock=new THREE.MeshStandardMaterial({color:0x21191c,roughness:.9}),lava=new THREE.MeshStandardMaterial({color:0xff3805,emissive:0xff2700,emissiveIntensity:2}),red=new THREE.MeshStandardMaterial({color:0xb91929,roughness:.55}),horns=new THREE.MeshStandardMaterial({color:0xf4d6b3}),eyes=new THREE.MeshStandardMaterial({color:0xffff78,emissive:0xffa000,emissiveIntensity:2});
const lake=new THREE.Mesh(new THREE.PlaneGeometry(2000,120),lava);lake.rotation.x=-Math.PI/2;lake.position.y=-1.8;scene.add(lake);const ground=new THREE.Mesh(new THREE.BoxGeometry(2000,.8,10),rock);ground.position.set(400,-1.3,0);ground.receiveShadow=true;scene.add(ground);
const mountains=[];for(let i=0;i<105;i++){const depth=i%2===0?-17:17;const height=8+Math.random()*24;const m=new THREE.Mesh(new THREE.ConeGeometry(4+Math.random()*8,height,5),new THREE.MeshStandardMaterial({color:i%3===0?0x42131a:0x241016,roughness:1,flatShading:true}));m.position.set(i*17-40,height/2-2,depth+(Math.random()-.5)*8);scene.add(m);mountains.push(m)}
const trail=[];const trailGeometry=new THREE.SphereGeometry(.17,7,6);for(let i=0;i<30;i++){const p=new THREE.Mesh(trailGeometry,new THREE.MeshBasicMaterial({color:i%3===0?0xffdf5b:0xff3d16,transparent:true,opacity:.6,depthWrite:false}));p.visible=false;scene.add(p);trail.push(p)}
const demon=new THREE.Group();const torso=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),red);torso.scale.set(.8,1,.65);torso.castShadow=true;demon.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.7,20,16),red);head.position.set(.15,1.04,.12);head.castShadow=true;demon.add(head);
for(const s of [-1,1]){const horn=new THREE.Mesh(new THREE.ConeGeometry(.22,.7,12),horns);horn.position.set(.15+s*.43,1.76,0);horn.rotation.z=-s*.25;demon.add(horn);const eye=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),eyes);eye.position.set(.46+s*.27,1.15,.48);demon.add(eye);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.35,4,8),red);leg.position.set(s*.38,-.8,0);demon.add(leg)}const mouth=new THREE.Mesh(new THREE.TorusGeometry(.2,.055,6,12,Math.PI),new THREE.MeshBasicMaterial({color:0x100307}));mouth.position.set(.6,.8,.48);mouth.rotation.z=Math.PI;demon.add(mouth);const tail=new THREE.Mesh(new THREE.TorusGeometry(.55,.1,8,20,Math.PI*1.3),red);tail.position.set(-.75,-.3,-.2);tail.rotation.y=Math.PI/2;demon.add(tail);scene.add(demon);
const rings=[];for(let i=0;i<22;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(1.4,.19,10,24),new THREE.MeshStandardMaterial({color:0xffcc4a,emissive:0xff5b00,emissiveIntensity:1.6,metalness:.7,roughness:.25}));ring.position.set(25+i*34,2.5+Math.random()*5,0);ring.rotation.y=Math.PI/2;scene.add(ring);rings.push({mesh:ring,used:false})}const obstacles=[];for(let i=0;i<75;i++){const h=1+Math.random()*3;const mesh=new THREE.Mesh(new THREE.ConeGeometry(.7+Math.random()*.5,h,6),rock);mesh.position.set(15+i*11+Math.random()*6,h/2-.9,(Math.random()-.5)*6);mesh.rotation.z=Math.random()*.25;scene.add(mesh);obstacles.push(mesh)}
const emberMat=[new THREE.MeshBasicMaterial({color:0xffa72f}),new THREE.MeshBasicMaterial({color:0xff3410})],embers=[];for(let i=0;i<110;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.07,5,4),emberMat[i%2]);m.position.set(Math.random()*150-20,Math.random()*18-1,(Math.random()-.5)*30);scene.add(m);embers.push(m)}
let trailClock=0;let trailIndex=0;let combo=0;let phase='ready',power=0,charging=false,dir=1,x=0,y=0,vx=0,vy=0,boosts=0,last=performance.now();let best=0;try{best=Number(localStorage.getItem('hellxbone_inferno_best')||0)}catch(e){}
const score=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),hint=document.getElementById('hint'),fill=document.getElementById('fill'),button=document.getElementById('launch');bestEl.textContent=best;
function reset(){phase='ready';power=0;charging=false;x=0;y=0;vx=0;vy=0;boosts=0;combo=0;trail.forEach(p=>p.visible=false);for(const r of rings){r.used=false;r.mesh.visible=true}demon.rotation.set(0,0,0);status.textContent='PRÊT À ENVOYER LE DÉMON ?';hint.textContent='Maintiens le bouton, puis relâche !';button.textContent='MAINTIENS POUR LANCER';fill.style.width='0%'}
button.addEventListener('pointerdown',e=>{e.preventDefault();if(phase==='done')reset();if(phase!=='ready')return;charging=true;button.setPointerCapture?.(e.pointerId)});
const launch=e=>{e.preventDefault();if(!charging)return;charging=false;phase='flying';vx=17+power*.65;vy=9+power*.22;status.textContent='ÇA PART EN ENFER !';hint.textContent='Touche le décor en plein vol pour un boost !';button.textContent='EN VOL...'};
button.addEventListener('pointerup',launch);button.addEventListener('pointercancel',launch);
renderer.domElement.addEventListener('pointerdown',()=>{if(phase==='flying'&&boosts<4){vy+=2.2;vx+=1;boosts++}});
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.04);last=now;if(charging){power+=dir*dt*95;if(power>=100){power=100;dir=-1}if(power<=0){power=0;dir=1}fill.style.width=power+'%';status.textContent='PUISSANCE : '+Math.round(power)+' %'}
if(phase==='flying'){trailClock+=dt;if(trailClock>.035){trailClock=0;const p=trail[trailIndex++%trail.length];p.position.set(x-.5,y+.2,(Math.random()-.5)*.6);p.scale.setScalar(.4+Math.random()*.8);p.material.opacity=.85;p.visible=true}vy-=19*dt;x+=vx*dt;y+=vy*dt;vx*=Math.pow(.994,dt*60);if(y<0){y=0;if(Math.abs(vy)>2){vy=-vy*.59;vx*=.82}else{vy=0;vx*=Math.pow(.92,dt*60)}}for(const r of rings){r.mesh.rotation.z+=dt*.9;if(!r.used&&Math.abs(x-r.mesh.position.x)<1.5&&Math.abs(y-r.mesh.position.y)<1.8){r.used=true;r.mesh.visible=false;vx+=9;vy+=4;combo++;status.textContent='ANNEAU INFERNAL ! BONUS x'+combo;hint.textContent='Propulsion supplémentaire !'}}for(const ob of obstacles){if(Math.abs(ob.position.x-x)<.8&&Math.abs(ob.position.z)<2&&y<1.5&&vx>2){vy=Math.max(vy,5);vx*=.78;ob.position.z=15}}if(Math.floor(x)>best){best=Math.floor(x);try{localStorage.setItem('hellxbone_inferno_best',best)}catch(e){}}score.innerHTML=Math.max(0,Math.floor(x))+' m<small>RECORD : <span id="best">'+best+'</span> m</small>';if(vx<.5&&y===0){phase='done';status.textContent='FIN DU VOL : '+Math.floor(x)+' MÈTRES !';hint.textContent='Tente de battre ton record infernal.';button.textContent='REJOUER';fill.style.width='0%'}}
demon.position.set(x,y+.1,0);glow.position.x=x+8;lake.material.emissiveIntensity=1.5+Math.sin(now*.002)*.5;if(phase==='flying'){demon.rotation.z-=dt*vx*.12;demon.rotation.x=Math.sin(now*.009)*.12}else if(phase==='ready'){demon.position.y=.15+Math.sin(now*.003)*.15;demon.rotation.z=Math.sin(now*.002)*.08}const targetX=x+8;camera.position.x+=(targetX-16-camera.position.x)*Math.min(1,dt*2.2);camera.position.y+=(Math.max(7,y+5)-camera.position.y)*Math.min(1,dt*2);camera.lookAt(targetX,Math.max(1,y*.45),0);for(const p of trail){if(p.visible){p.scale.multiplyScalar(1+dt*2);p.material.opacity=Math.max(0,p.material.opacity-dt*1.3);if(p.material.opacity===0)p.visible=false}}for(const p of embers){p.position.y+=dt*.6;if(p.position.y>18)p.position.y=-1;if(p.position.x<camera.position.x-30)p.position.x+=150;if(p.position.x>camera.position.x+130)p.position.x-=150}renderer.render(scene,camera)}
requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
