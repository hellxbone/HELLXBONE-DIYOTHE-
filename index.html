const shareButtons=(title,url,excerpt='')=>`<div class="share-row"><span class="share-label">📣 Partager</span><button class="share-btn facebook" data-share="facebook" data-share-title="${esc(title)}" data-share-url="${esc(url)}" data-share-excerpt="${esc(excerpt)}">Facebook</button><button class="share-btn sms" data-share="sms" data-share-title="${esc(title)}" data-share-url="${esc(url)}" data-share-excerpt="${esc(excerpt)}">💬 SMS</button><button class="share-btn messenger" data-share="messenger" data-share-title="${esc(title)}" data-share-url="${esc(url)}" data-share-excerpt="${esc(excerpt)}">💙 Messenger</button><button class="share-btn whatsapp" data-share="whatsapp" data-share-title="${esc(title)}" data-share-url="${esc(url)}" data-share-excerpt="${esc(excerpt)}">🟢 WhatsApp</button></div>`;
async function doShare(platform,title,url,excerpt=''){
  const link=url||location.href;
  const text=`🤘 ${title}\n\n${excerpt?excerpt+'\n\n':''}🔥 Lire l’article complet sur HELLXBONE :\n${link}`;
  if(platform==='sms'){
    const smsText=text;
    try{ await navigator.clipboard.writeText(smsText); }catch(e){}
    window.location.href='sms:?body='+encodeURIComponent(smsText);
    return;
  }
  if(platform==='whatsapp'){
    try{ await navigator.clipboard.writeText(text); }catch(e){}
    window.location.href='https://wa.me/?text='+encodeURIComponent(text);
    return;
  }
  if(platform==='messenger'){
    try{ await navigator.clipboard.writeText(text); }catch(e){}
    if(navigator.share){
      try{
        await navigator.share({title:title,text:text});
        return;
      }catch(e){}
    }
    const messengerUrl='fb-messenger://share/?link='+encodeURIComponent(link);
    window.location.href=messengerUrl;
    setTimeout(()=>{
      if(document.visibilityState==='visible'){
        alert('Le texte est copié. Colle-le dans Messenger :\n\n'+text);
        window.location.href='https://www.messenger.com/';
      }
    },1200);
    return;
  }
  if(platform==='facebook'){
    try{
      const res=await fetch('./hellxbone-share-header-v10.png?share=v12',{cache:'no-store'});
      const blob=await res.blob();
      const file=new File([blob],'HELLXBONE-share.png',{type:blob.type||'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
        await navigator.share({title:title,text:text,files:[file]});
        return;
      }
      if(navigator.share){
        await navigator.share({title:title,text:text});
        return;
      }
    }catch(e){}
    alert('Le partage direct Facebook n’est pas disponible dans ce navigateur. Ouvre l’application depuis Chrome ou l’icône HELLXBONE installée.');
    return;
  }
  if(navigator.share){
    try{await navigator.share({title,text,url:link});return}catch(e){}
  }
  try{
    await navigator.clipboard.writeText(text);
    alert('Texte copié. Ouvre '+(platform==='instagram'?'Instagram':'TikTok')+' et colle-le dans ta publication.');
  }catch(e){
    prompt('Copie ce texte pour le partager :',text);
  }
}
