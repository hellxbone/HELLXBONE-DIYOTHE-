<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><meta name="description" content="HELLXBONE — créations, articles et culture metal"><link rel="manifest" href="manifest.webmanifest?v=3"><link rel="icon" href="hellxbone-icon-v3.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="hellxbone-icon-v3.svg?v=3"><title>HELLXBONE</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f3f3f3;background:#101010}*{box-sizing:border-box}body{margin:0}a{color:inherit}header{background:#080808;border-bottom:2px solid #a91925;padding:22px 18px;text-align:center}header h1{font-size:clamp(30px,9vw,52px);letter-spacing:4px;margin:0;font-weight:950}header small{color:#bbb;letter-spacing:2px}nav{display:flex;position:sticky;top:0;z-index:5;background:#171717;border-bottom:1px solid #444;justify-content:center;overflow-x:auto}nav button{background:none;border:0;color:#ddd;padding:16px 12px;font-weight:750;cursor:pointer}nav button[aria-current=page]{color:#fff;border-bottom:3px solid #c52734}main{max-width:800px;margin:auto;padding:20px 16px 90px}.hero{padding:32px 20px;background:linear-gradient(135deg,#310b12,#151515 55%,#080808);border:1px solid #66202b;border-radius:14px;text-align:center}.hero h2{font-size:32px;margin:8px 0}.hero p{color:#ddd}.button{display:inline-block;text-decoration:none;background:#b4202e;color:white;border:0;border-radius:8px;padding:13px 19px;font-weight:800;cursor:pointer}.button.secondary{background:#303030}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:17px;margin-top:18px}.card{border:1px solid #414141;background:#1b1b1b;border-radius:12px;overflow:hidden}.visual{height:155px;background:radial-gradient(circle at 50% 25%,#7d2730,#1b1b1b 62%);display:grid;place-items:center;font-size:65px}.card .inner{padding:18px}.card h3{margin:0 0 8px}.card p{color:#ccc;line-height:1.55}.price{font-size:25px;font-weight:900}.pill{font-size:12px;color:#f3d4d6;text-transform:uppercase;letter-spacing:1px}.section-title{margin-top:30px}.empty{padding:24px;background:#242424;border-left:3px solid #c52734;color:#ddd}footer{color:#999;text-align:center;font-size:12px;padding:24px}.hidden{display:none}article{line-height:1.7}article h2{line-height:1.2}article .back{margin-bottom:20px}input{width:100%;background:#222;color:white;border:1px solid #666;border-radius:7px;padding:12px;font:inherit}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}
.chatbox{border:1px solid #57ff00;background:#080808;border-radius:14px;overflow:hidden;box-shadow:0 0 20px #57ff0030}.chathead{padding:16px;background:#101510;border-bottom:1px solid #57ff00;font-weight:900;color:#8cff4a}.chatmessages{min-height:360px;max-height:55vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:82%;padding:11px 14px;border-radius:14px;line-height:1.4}.bubble.bot{align-self:flex-start;background:#202020;border:1px solid #444}.bubble.user{align-self:flex-end;background:#163d0b;border:1px solid #57ff00}.chatcomposer{display:flex;gap:8px;padding:12px;border-top:1px solid #333}.chatcomposer input{flex:1}.chatcomposer button{background:#57ff00;color:#050505;border:0;border-radius:8px;padding:0 16px;font-weight:900}.chatnote{color:#aaa;font-size:13px;margin-top:12px}
</style><link rel="stylesheet" href="digicode.css?v=2"></head><body><header><h1>HELLXBONE</h1><small>ART • ROCK • METAL</small></header><nav aria-label="Navigation principale"><button data-page="accueil" aria-current="page">Accueil</button><button data-page="magazine">Magazine</button><button data-page="boutique">Boutique</button><button data-page="jeu">Jeu</button><button data-page="apropos">À propos</button></nav><main id="app"></main><footer>HELLXBONE — Créations indépendantes<br>Les paiements sont effectués sur la boutique SumUp.</footer><script src="content.js?v=20261003-boutique"></script><script src="digicode.js?v=3"></script><script>const data=window.HELLXBONE;const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=s=>/^https:\/\//i.test(s||'')?s:'';
const productCard=p=>`<div class="card"><div class="visual">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" style="width:100%;height:100%;object-fit:cover">`:'☠'}</div><div class="inner"><span class="pill">Création HELLXBONE</span><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><p class="price">${esc(p.price)}</p>${safeUrl(p.sumupUrl)?`<a class="button" href="${esc(p.sumupUrl)}" target="_blank" rel="noopener noreferrer">Acheter sur SumUp ↗</a>`:'<p class="pill">Lien SumUp à ajouter</p>'}</div></div>`;
const articleCard=a=>`<div class="card">${a.image?`<img src="${esc(a.image)}" alt="${esc(a.imageAlt||a.title)}" loading="lazy" style="display:block;width:100%;height:260px;object-fit:contain;background:#111">`: ''}<div class="inner"><span class="pill">${esc(a.category)} · ${esc(a.date)}</span><h3>${esc(a.title)}</h3><p>${esc(a.excerpt)}</p><button class="button secondary" data-article="${esc(a.id)}">Lire l’article →</button></div></div>`;
function render(page='accueil'){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));if(page==='accueil'){app.innerHTML=`<section class="hero"><span class="pill">Bienvenue dans l’underground</span><h2>HELLXBONE</h2><p>Créations originales, articles et découvertes rock & metal.</p><button class="button" data-go="boutique">Voir les créations →</button></section><h2 class="section-title">À la une</h2><div class="grid">${data.articles.slice(0,2).map(articleCard).join('')}</div><h2 class="section-title">La boutique</h2><div class="grid">${data.products.slice(0,2).map(productCard).join('')}</div>`}else if(page==='jeu'){window.HellCode.render();}else if(page==='magazine'){app.innerHTML=`<h2>Le magazine</h2><p>Actualités, interviews et créations.</p><div class="grid">${data.articles.map(articleCard).join('')}</div>`}else if(page==='boutique'){app.innerHTML=`<h2>La boutique</h2><p>Découvre mes créations. Le paiement s’effectue directement sur SumUp.</p><div class="grid">${data.products.map(productCard).join('')}</div>${safeUrl(data.sumupShop)?`<p><a class="button secondary" href="${esc(data.sumupShop)}" target="_blank" rel="noopener noreferrer">Toute la boutique SumUp ↗</a></p>`:''}` }else{app.innerHTML=`<h2>À propos</h2><p>HELLXBONE est un univers artistique indépendant mêlant rock, metal et créations originales.</p><p>À travers l’association DIYOTHE, je combats la maladie et l’isolement social par la création artistique.</p><a class="button" href="${esc(data.facebook)}" target="_blank" rel="noopener noreferrer">Ma page Facebook ↗</a>`}window.scrollTo(0,0)}
function openArticle(id){const a=data.articles.find(x=>x.id===id);if(!a)return;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current','false'));app.innerHTML=`<article><button class="button secondary back" data-go="magazine">← Retour aux articles</button><p class="pill">${esc(a.category)} · ${esc(a.date)}</p><h2>${esc(a.title)}</h2>${a.image?`<img src="${esc(a.image)}" alt="${esc(a.imageAlt||a.title)}" style="display:block;width:100%;max-width:520px;height:auto;margin:20px auto;border-radius:12px">`: ''}${(a.body||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${safeUrl(a.shopUrl)?`<p><a class="button" href="${esc(a.shopUrl)}" target="_blank" rel="noopener noreferrer">Découvrir ma boutique 🤘</a></p>`:''}</article>`;window.scrollTo(0,0)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page],[data-go],[data-article]');if(!nav)return;if(nav.dataset.article)openArticle(nav.dataset.article);else render(nav.dataset.page||nav.dataset.go)});render(location.hash==='#jeu'?'jeu':'accueil');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});


</script><script data-goatcounter="https://hellxbone.goatcounter.com/count"
