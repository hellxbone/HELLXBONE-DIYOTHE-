<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>HELLXBONE — RIFF OF THE DAMNED</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#060608;color:#f7e9dc;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:none}
#wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px;gap:5px;background:radial-gradient(ellipse at center,#251015,#070608 72%)}
header{width:min(100%,1100px);display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:clamp(11px,2.7vw,17px);letter-spacing:1px}header b{color:#f24d3e}header a{color:#b9ff89;text-decoration:none}
canvas{display:block;width:min(100%,1100px);max-height:calc(100dvh - 182px);aspect-ratio:16/9;object-fit:contain;background:#08070d;border:2px solid #763c34;box-shadow:0 0 24px #a3222850;image-rendering:pixelated}
#hud{position:absolute;top:45px;left:50%;transform:translateX(-50%);width:min(97%,1060px);display:flex;justify-content:space-between;gap:10px;pointer-events:none;text-shadow:1px 2px black;font-size:clamp(11px,2.2vw,17px);font-weight:900}
#hud span{color:#a7ff60}#hint{font-size:11px;color:#ddc6ba;text-align:center;margin:1px}
#controls{width:min(100%,980px);display:flex;justify-content:space-between;gap:5px;user-select:none;-webkit-user-select:none}
.group{display:flex;gap:6px}button{border:2px solid #8c4037;border-radius:12px;color:#fff;background:linear-gradient(#47302c,#170d13);font-weight:900;min-width:58px;height:55px;font-size:17px;touch-action:none;box-shadow:0 4px 0 #000}
button:active,.pressed{background:#657c29!important;border-color:#b6fa65;transform:translateY(2px)}#jump{border-color:#85b647}#attack{border-color:#dd563a}
@media(min-width:800px){#controls{max-width:650px}button{height:46px}}@media(max-height:470px){header,#hint{display:none}canvas{max-height:calc(100dvh - 74px)}button{height:52px}#hud{top:5px}}
</style></head><body><div id="wrap"><header><div>☠ <b>HELLXBONE</b> · RIFF OF THE DAMNED</div><a href="./?page=jeux">✕ RETOUR</a></header>
<canvas id="game" width="960" height="540" aria-label="Jeu de plateforme metal 2D"></canvas>
<div id="hud"><div id="health"></div><div id="status"></div></div>
<div id="controls"><div class="group"><button data-k="left" aria-label="Gauche">◀</button><button data-k="right" aria-label="Droite">▶</button></div><div class="group"><button id="attack" data-k="attack">⚔ RIFF</button><button id="jump" data-k="jump">▲ SAUT</button><button data-k="dash">⚡</button></div></div><div id="hint">Explore · Affronte les démons · Récupère la relique pour débloquer le dash · Terrasse le gardien</div></div>
<script>
(()=>{
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),H=document.getElementById('health'),S=document.getElementById('status');
const W=960,Y=540,rooms=4,RW=1900,keys={left:0,right:0,jump:0,attack:0,dash:0};
let player,foes,fx,clock=0,shake=0,won=false,notice='',noticeT=0,gate=false,opened=false,sound=null;
const platforms=[
[[0,490,1900,50],[230,395,210,20],[560,320,200,20],[890,402,200,20],[1250,340,200,20],[1580,400,210,20]],
[[0,490,1900,50],[190,410,200,20],[490,335,230,20],[820,390,220,20],[1190,305,240,20],[1510,395,240,20]],
[[0,490,1900,50],[260,385,240,20],[640,305,230,20],[1010,380,220,20],[1380,320,270,20]],
[[0,490,1900,50],[160,390,230,20],[510,330,220,20],[930,392,230,20],[1320,340,230,20]]];
const spikes=[[[765,472,96],[1110,472,100]],[[740,472,95],[1120,472,90]],[[880,472,120],[1230,472,100]],[[760,472,120],[1170,472,100]]];
function tone(f,d=.09,type='sawtooth',vol=.035){try{sound=sound||new (window.AudioContext||window.webkitAudioContext)();const o=sound.createOscillator(),v=sound.createGain();o.type=type;o.frequency.setValueAtTime(f,sound.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(35,f*.55),sound.currentTime+d);v.gain.setValueAtTime(vol,sound.currentTime);v.gain.exponentialRampToValueAtTime(.0001,sound.currentTime+d);o.connect(v).connect(sound.destination);o.start();o.stop(sound.currentTime+d)}catch(e){}}
function init(){player={room:0,x:70,y:375,w:30,h:46,vx:0,vy:0,hp:5,max:5,face:1,on:false,cd:0,inv:0,dash:false,flash:0,attack:0,progress:0};foes=[];fx=[];clock=0;won=false;gate=false;opened=false;notice='LES PORTES DE L’ENFER S’OUVRENT';noticeT=130;
for(let r=0;r<4;r++)for(let i=0;i<(r===3?3:5);i++)foes.push({room:r,x:350+i*285,y:442,w:32,h:48,hp:r===3?4:2,vx:i%2?-1:1,home:350+i*285,dead:false,hit:0,boss:false});
foes.push({room:3,x:1660,y:390,w:95,h:100,hp:18,vx:-1,home:1660,dead:false,hit:0,boss:true});}
function msg(t){notice=t;noticeT=165}
const rect=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const rnd=(a,b)=>a+Math.random()*(b-a);
function particles(x,y,color,n=9){for(let i=0;i<n;i++)fx.push({x,y,vx:rnd(-5,5),vy:rnd(-6,1),life:rnd(12,28),color})}
function hurt(n=1){if(player.inv||won)return;player.hp-=n;player.inv=85;shake=14;tone(85,.22,'sawtooth');particles(player.x+15,player.y+25,'#d83f33',17);if(player.hp<=0){player.hp=5;player.room=0;player.x=70;player.y=380;player.vx=player.vy=0;msg('TU ES TOMBÉ… L’ENFER TE RÉCLAME !')}}
function controls(){for(const b of document.querySelectorAll('[data-k]')){const k=b.dataset.k;for(const ev of ['pointerdown','pointerup','pointercancel','pointerleave'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=ev==='pointerdown'?1:0;b.classList.toggle('pressed',!!keys[k]);if(ev==='pointerdown')try{b.setPointerCapture(e.pointerId)}catch(err){}})}}
controls();
const km={ArrowLeft:'left',KeyA:'left',KeyQ:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',KeyJ:'attack',KeyK:'dash',ShiftLeft:'dash'};
window.addEventListener('keydown',e=>{const k=km[e.code];if(k){e.preventDefault();keys[k]=1}});window.addEventListener('keyup',e=>{const k=km[e.code];if(k){e.preventDefault();keys[k]=0}});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
function update(){
clock++;if(noticeT)noticeT--;if(shake)shake--;if(player.inv)player.inv--;if(player.cd)player.cd--;if(player.attack)player.attack--;if(player.flash)player.flash--;
if(won){if(keys.attack||keys.jump){init();keys.attack=keys.jump=0}return}
const p=player,prevY=p.y;
p.vx=keys.left?-4.25:keys.right?4.25:0;if(p.vx)p.face=Math.sign(p.vx);
if(keys.jump&&p.on){p.vy=-12.5;p.on=false;tone(180,.13,'triangle',.025);keys.jump=0}
if(keys.dash&&p.dash&&p.cd<=0){p.vx=p.face*18;p.flash=13;p.cd=80;particles(p.x,p.y+25,'#adff43',18);tone(350,.18);keys.dash=0}
if(p.flash>0)p.vx=p.face*15;
p.vy=Math.min(p.vy+.62,14);p.x+=p.vx;p.x=Math.max(0,Math.min(RW-p.w,p.x));p.y+=p.vy;p.on=false;
for(const [x,y,w,h] of platforms[p.room])if(p.x+p.w>x&&p.x<x+w&&prevY+p.h<=y+10&&p.y+p.h>=y&&p.vy>=0){p.y=y-p.h;p.vy=0;p.on=true}
if(p.y>600)hurt(1);
for(const [x,y,w] of spikes[p.room])if(rect(p,{x,y,w,h:18}))hurt();
if(keys.attack&&p.attack===0){p.attack=17;tone(130,.16,'sawtooth',.045);const blade={x:p.face>0?p.x+p.w:p.x-68,y:p.y+2,w:68,h:48};particles(blade.x+35,blade.y+24,'#a6fc59',7);for(const e of foes)if(e.room===p.room&&!e.dead&&rect(blade,e)){e.hp--;e.hit=12;shake=5;particles(e.x+e.w/2,e.y+20,'#e24e36',14);if(e.hp<=0){e.dead=true;particles(e.x+e.w/2,e.y+20,'#b6fe6d',25);tone(70,.3)}else tone(110,.09)}}
for(const e of foes){if(e.dead||e.room!==p.room)continue;if(e.hit)e.hit--;const speed=e.boss?1.2:.75;e.x+=e.vx*speed;if(Math.abs(e.x-e.home)>(e.boss?170:65))e.vx*=-1;if(rect(p,e))hurt(e.boss?2:1)}
if(p.room===1&&!p.dash&&rect(p,{x:1355,y:240,w:90,h:65})){p.dash=true;p.hp=Math.min(5,p.hp+1);msg('RELIQUE ACQUISE : DASH INFERNAL ! ⚡');tone(610,.55,'triangle',.07);particles(1400,270,'#adff43',45)}
if(p.room===2&&!gate&&p.x>1600){gate=true;msg('LE SCEAU EST BRISÉ — LE GARDIEN T’ATTEND')}
if(p.room===3&&!opened&&foes.find(e=>e.boss).dead){opened=true;msg('LE GARDIEN EST VAINCU ! REJOINS LE PORTAIL')}
if(p.x>=RW-33){if(p.room===2&&!p.dash){p.x=RW-85;msg('IL TE FAUT LA RELIQUE VERTE !')}else if(p.room===3&&!opened){p.x=RW-85;msg('TERRASSE LE GARDIEN !')}else if(p.room===3){won=true;tone(800,.5,'triangle',.08)}else {p.room++;p.x=18;p.y=365;p.vy=0;p.hp=Math.min(5,p.hp+1);msg(['','CRYPTES DU RIFF','FORGES DES DAMNÉS','TRÔNE DU GARDIEN'][p.room]);tone(380,.3)}}
if(p.x===0&&p.room>0&&keys.left){p.room--;p.x=RW-70;p.y=350;p.vy=0}
fx=fx.filter(v=>v.life-->0);for(const v of fx){v.x+=v.vx;v.y+=v.vy;v.vy+=.22}
H.textContent='♥'.repeat(Math.max(0,p.hp))+'♡'.repeat(Math.max(0,5-p.hp));S.textContent='ZONE '+(p.room+1)+'/4 · '+(p.dash?'⚡ DASH':'🔒 DASH');
}
function draw(){
const p=player,cam=Math.max(0,Math.min(RW-W,p.x-400));g.save();g.clearRect(0,0,W,Y);if(shake)g.translate(rnd(-3,3),rnd(-3,3));
const bg=g.createLinearGradient(0,0,0,Y);bg.addColorStop(0,['#10091d','#160912','#130e20','#260c14'][p.room]);bg.addColorStop(1,'#460f16');g.fillStyle=bg;g.fillRect(0,0,W,Y);
for(let layer=0;layer<3;layer++){g.fillStyle=['#21101d','#2a1721','#39202a'][layer];for(let i=-1;i<12;i++){const x=i*145-(cam*(.13+layer*.12)%145);const h=80+((i*71+layer*103+1000)%135);g.fillRect(x,Y-h-45,75,h);g.beginPath();g.moveTo(x-12,Y-h-45);g.lineTo(x+37,Y-h-100);g.lineTo(x+87,Y-h-45);g.fill()}}
g.save();g.translate(-cam,0);for(let i=0;i<RW;i+=180){g.fillStyle='#cb392212';g.fillRect(i,40,5,480);g.fillStyle='#f0421626';g.beginPath();g.arc(i+20,85+Math.sin(clock*.03+i)*9,17,0,7);g.fill()}
for(const [x,y,w,h] of platforms[p.room]){g.fillStyle='#19161e';g.fillRect(x,y,w,h);g.fillStyle='#91605a';g.fillRect(x,y,w,5);g.fillStyle='#492526';for(let i=x+10;i<x+w;i+=48)g.fillRect(i,y+8,4,Math.min(24,h-8))}
for(const [x,y,w] of spikes[p.room]){g.fillStyle='#d74733';for(let i=x;i<x+w;i+=16){g.beginPath();g.moveTo(i,y+18);g.lineTo(i+8,y-6);g.lineTo(i+16,y+18);g.fill()}}
if(p.room===1&&!p.dash){const a=1355;g.shadowBlur=28;g.shadowColor='#b0ff43';g.fillStyle='#b4ff54';g.beginPath();g.arc(a+45,269+Math.sin(clock*.06)*12,19,0,Math.PI*2);g.fill();g.shadowBlur=0;g.font='bold 17px monospace';g.fillText('⚡',a+35,274)}
for(const e of foes)if(e.room===p.room&&!e.dead){g.fillStyle=e.hit?'#fff0aa':e.boss?'#8b1c25':'#a22c35';g.fillRect(e.x,e.y,e.w,e.h);g.fillStyle='#0b080d';g.fillRect(e.x+4,e.y+9,e.w-8,13);g.fillStyle='#b7ff62';g.fillRect(e.x+7,e.y+13,e.boss?26:7,6);if(e.boss)g.fillRect(e.x+60,e.y+13,26,6);g.fillStyle='#dadada';g.beginPath();g.moveTo(e.x+2,e.y);g.lineTo(e.x-10,e.y-22);g.lineTo(e.x+24,e.y+3);g.fill();g.beginPath();g.moveTo(e.x+e.w-2,e.y);g.lineTo(e.x+e.w+10,e.y-22);g.lineTo(e.x+e.w-24,e.y+3);g.fill();if(e.boss){g.fillStyle='#aaff54';g.fillRect(e.x,e.y-20,95*Math.max(0,e.hp)/18,5)}}
if(p.inv%8<4){g.fillStyle=p.flash?'#c0fa64':'#1a1b1f';g.fillRect(p.x,p.y,p.w,p.h);g.fillStyle='#b9a5a5';g.fillRect(p.x+5,p.y-7,21,17);g.fillStyle='#b5ff5b';g.fillRect(p.x+(p.face>0?19:5),p.y-1,6,5);g.fillStyle='#b4272a';g.fillRect(p.x+6,p.y+17,18,7);g.fillStyle='#bab6b1';g.fillRect(p.x+3,p.y+30,7,17);g.fillRect(p.x+21,p.y+30,7,17)}
if(p.attack){g.strokeStyle='#b6ff63';g.lineWidth=8;g.shadowBlur=16;g.shadowColor='#c6ff43';g.beginPath();g.arc(p.x+p.w/2+p.face*28,p.y+19,42,p.face>0?-.9:2.2,p.face>0?1.1:4.2);g.stroke();g.shadowBlur=0}
for(const v of fx){g.fillStyle=v.color;g.fillRect(v.x,v.y,4,4)}
g.fillStyle=p.room===3&&opened?'#a8ff5b':'#8c252a';g.fillRect(RW-28,335,23,155);g.restore();
if(noticeT){g.fillStyle='#050309d9';g.fillRect(145,60,670,64);g.strokeStyle='#d8453a';g.strokeRect(145,60,670,64);g.fillStyle='#eeefd9';g.font='bold 20px system-ui';g.textAlign='center';g.fillText(notice,480,101)}
if(won){g.fillStyle='#050309e8';g.fillRect(0,0,W,Y);g.textAlign='center';g.fillStyle='#b7ff55';g.font='bold 47px system-ui';g.fillText('VICTOIRE INFERNALE',480,215);g.fillStyle='#fff';g.font='22px system-ui';g.fillText('Tu as libéré le RIFF DES DAMNÉS !',480,268);g.font='16px system-ui';g.fillText('Appuie sur SAUT ou RIFF pour recommencer',480,326)}
g.restore();
}
function tick(){update();draw();requestAnimationFrame(tick)}init();requestAnimationFrame(tick);
})();
</script></body></html>
