<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100821"><title>HELL DROP — HELLXBONE ARCADE</title><style>
*{box-sizing:border-box}body{margin:0;background:#080613;color:#fff;font-family:system-ui,Arial,sans-serif;text-align:center}header{height:58px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#111022;border-bottom:2px solid #9aff42}header a{color:#9aff42;text-decoration:none;font-weight:800}header strong{color:#e8fc70;letter-spacing:2px}main{width:min(100%,460px);margin:auto}.stats{display:flex;justify-content:space-around;align-items:center;padding:9px 4px;font-weight:800;background:#15102b}.stats b{color:#fcdc43}canvas{display:block;width:100%;height:auto;touch-action:none;background:#100829}button{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(#dbff55,#70d529);color:#192006;box-shadow:0 4px 0 #317016}.actions{display:flex;justify-content:center;gap:12px;padding:12px;background:#130d25}.actions button{flex:1;max-width:200px}.instructions{font-size:13px;color:#c3b8d8;padding:6px 15px 18px;line-height:1.5}.overlay{position:fixed;inset:0;background:#070612df;display:flex;align-items:center;justify-content:center;padding:22px;z-index:5}.modal{max-width:375px;background:linear-gradient(160deg,#34205a,#100c27);border:2px solid #a3ff55;border-radius:24px;padding:28px 22px;box-shadow:0 0 40px #7efa3450}.modal h1{font-size:38px;margin:0;color:#d5ff44;text-shadow:0 0 20px #7bff20}.modal p{line-height:1.6}.modal button{width:100%}.hide{display:none}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body>
<header><a href="./index.html#jeu">❮ JEUX</a><strong>☠ HELL DROP</strong><span>666</span></header><main><div class="stats"><span>NIVEAU <b id="level">1</b>/10</span><span>CRÂNES <b id="coins">0</b></span><span>SCORE <b id="score">0</b></span></div><canvas id="game" width="420" height="680" aria-label="Jeu HELL DROP : guider un crâne à travers des pièges et ramasser des crânes dorés"></canvas><div class="actions"><button id="left" aria-label="Pousser à gauche">◀ GAUCHE</button><button id="right" aria-label="Pousser à droite">DROITE ▶</button></div><div class="instructions">Maintiens GAUCHE ou DROITE pour guider le crâne. Attrape les pièces dorées et rejoins le portail vert. Évite les pics rouges !</div></main>
<div class="overlay" id="overlay"><div class="modal"><h1 id="headline">HELL DROP</h1><p id="message">10 niveaux dans les profondeurs de HELLXBONE. Fais tomber ton crâne jusqu'au portail infernal !</p><button id="start">JOUER ▶</button></div></div>
<script>
(()=>{'use strict';const cv=document.getElementById('game'),c=cv.getContext('2d'),$=id=>document.getElementById(id),W=420,H=680;let level=1,score=0,coins=0,running=false,last=0,keys={left:false,right:false},ball,platforms=[],gems=[],hazards=[],particles=[],gate,elapsed=0;const rnd=(a,b)=>a+Math.random()*(b-a);function reset(){ball={x:210,y:52,vx:0,vy:0,r:13};platforms=[];gems=[];hazards=[];particles=[];elapsed=0;let side=level%2;for(let i=0;i<6;i++){const y=142+i*76,x=side?rnd(12,72):rnd(172,245),w=rnd(160,198);platforms.push({x,y,w,h:13});for(let j=0;j<4;j++)gems.push({x:x+25+j*(w-50)/3,y:y-23,taken:false});if(i>0&&(i+level)%3===0)hazards.push({x:side?x+w-28:x+7,y:y-12,w:26,h:13});side=1-side}for(let i=0;i<5;i++)gems.push({x:75+i*67,y:615,taken:false});gate={x:176,y:646,w:68,h:28};sync()}function sync(){$('level').textContent=level;$('coins').textContent=coins;$('score').textContent=score}function show(title,msg,button,fn){running=false;$('headline').textContent=title;$('message').textContent=msg;$('start').textContent=button;$('overlay').classList.remove('hide');$('start').onclick=()=>{$('overlay').classList.add('hide');fn();running=true;last=performance.now();requestAnimationFrame(frame)}}function start(){level=1;score=0;coins=0;reset();running=true;last=performance.now();requestAnimationFrame(frame)}function die(){show('PERDU !','Les pièges ont eu ton crâne. Réessaie ce niveau !','REJOUER',reset)}function win(){const bonus=200+level*50;score+=bonus;sync();if(level===10){const best=Math.max(score,Number(localStorage.getItem('hell-drop-best')||0));localStorage.setItem('hell-drop-best',String(best));show('HELLXBONE MASTER','10 niveaux terminés ! Score : '+score+' • Record sur cet appareil : '+best,'RECOMMENCER',start);return}show('NIVEAU TERMINÉ','Bonus +'+bonus+' points. Descends encore plus profondément !','NIVEAU SUIVANT',()=>{level++;reset()})}function update(dt){elapsed+=dt;let prevY=ball.y;ball.vx+=(Number(keys.right)-Number(keys.left))*920*dt;ball.vx*=Math.pow(.985,dt*60);ball.vx=Math.max(-230,Math.min(230,ball.vx));ball.vy=Math.min(440,ball.vy+540*dt);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.6}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.6}if(ball.y<ball.r){ball.y=ball.r;ball.vy=0}for(const p of platforms){if(ball.vy>0&&prevY+ball.r<=p.y+6&&ball.y+ball.r>=p.y&&ball.x+ball.r>p.x&&ball.x-ball.r<p.x+p.w){ball.y=p.y-ball.r;ball.vy=-Math.max(115,Math.abs(ball.vy)*.58);ball.vx+=(ball.x-(p.x+p.w/2))*1.1}}for(const g of gems){if(!g.taken&&Math.hypot(g.x-ball.x,g.y-ball.y)<ball.r+9){g.taken=true;coins++;score+=10;sync();for(let i=0;i<7;i++)particles.push({x:g.x,y:g.y,vx:rnd(-90,90),vy:rnd(-100,20),life:.5})}}for(const h of hazards){if(ball.x+ball.r>h.x&&ball.x-ball.r<h.x+h.w&&ball.y+ball.r>h.y&&ball.y-ball.r<h.y+h.h){die();return}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(ball.y>gate.y-5&&ball.x>gate.x-9&&ball.x<gate.x+gate.w+9){win();return}if(ball.y>H+35||elapsed>75)die()}function glow(x,y,r,col){const g=c.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r)}function draw(){let bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#152a7d');bg.addColorStop(.45,'#211047');bg.addColorStop(1,'#070712');c.fillStyle=bg;c.fillRect(0,0,W,H);for(let i=0;i<35;i++){let x=(i*97+31)%W,y=(i*149+17)%H;glow(x,y,18,i%3?'#4a2db055':'#10e8ce66')}for(let i=0;i<11;i++){let y=i*74-20;c.fillStyle=i%2?'#25133f':'#301950';c.beginPath();c.ellipse(i%2?0:420,y,68,58,0,0,Math.PI*2);c.fill()}for(const p of platforms){c.fillStyle='#090c29';c.fillRect(p.x-3,p.y-1,p.w+6,19);c.fillStyle='#55438e';c.beginPath();c.roundRect(p.x,p.y,p.w,12,6);c.fill();c.fillStyle='#69f43f';c.fillRect(p.x+5,p.y,p.w-10,4);for(let j=0;j<4;j++){c.fillStyle='#34235e';c.beginPath();c.arc(p.x+15+j*(p.w-30)/3,p.y+11,4,0,7);c.fill()}}for(const h of hazards){c.fillStyle='#fc3f55';for(let j=0;j<3;j++){c.beginPath();c.moveTo(h.x+j*9,h.y+h.h);c.lineTo(h.x+j*9+5,h.y-9);c.lineTo(h.x+j*9+10,h.y+h.h);c.fill()}}for(const g of gems){if(g.taken)continue;glow(g.x,g.y,18,'#ffd34377');c.fillStyle='#ffdd29';c.beginPath();c.arc(g.x,g.y,8,0,7);c.fill();c.fillStyle='#fff6a8';c.beginPath();c.arc(g.x-2,g.y-2,3,0,7);c.fill()}glow(210,660,66,'#3cff91bb');c.fillStyle='#164e36';c.fillRect(gate.x,gate.y,gate.w,gate.h);c.strokeStyle='#91ff48';c.lineWidth=6;c.strokeRect(gate.x,gate.y,gate.w,gate.h);c.fillStyle='#a5ff75';c.font='bold 13px system-ui';c.textAlign='center';c.fillText('SORTIE',210,637);glow(ball.x,ball.y,34,'#ce79f7aa');c.fillStyle='#f4e7ff';c.beginPath();c.arc(ball.x,ball.y,ball.r,0,7);c.fill();c.fillStyle='#231132';c.beginPath();c.ellipse(ball.x-5,ball.y-1,3.5,5,0,0,7);c.ellipse(ball.x+5,ball.y-1,3.5,5,0,0,7);c.fill();c.beginPath();c.moveTo(ball.x,ball.y+2);c.lineTo(ball.x-4,ball.y+8);c.lineTo(ball.x+4,ball.y+8);c.fill();for(const p of particles){c.globalAlpha=Math.max(0,p.life*2);c.fillStyle='#ffdc41';c.fillRect(p.x,p.y,5,5)}c.globalAlpha=1}function frame(t){if(!running)return;const dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();if(running)requestAnimationFrame(frame)}for(const side of ['left','right']){const b=$(side);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[side]=true;b.setPointerCapture(e.pointerId)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys[side]=false)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.left=keys.right=false;if(running){running=false;show('PAUSE','Prêt à reprendre ta descente ?','CONTINUER',()=>{})}}});reset();draw();$('start').onclick=()=>{$('overlay').classList.add('hide');start()};})();
</script></body></html>
