<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d090d"><title>HELLROAD — GPS FROM HELL</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark;--red:#ff402c;--gold:#ffb449;--bg:#110b10}*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0}body{font-family:system-ui,Arial;background:var(--bg);color:white;overflow:hidden}#map{position:absolute;inset:0;background:#17141a}.leaflet-container{background:#17141a}.leaflet-control-attribution{font-size:9px!important;background:#171015bb!important;color:#ccc!important}.leaflet-control-attribution a{color:#ffb449!important}.leaflet-control-zoom{display:none}.leaflet-tile-pane{filter:grayscale(.8) brightness(.63) contrast(1.35) sepia(.2)}.leaflet-overlay-pane{filter:drop-shadow(0 0 5px #ff411b)}
.top{position:absolute;z-index:1000;top:env(safe-area-inset-top);left:0;right:0;padding:12px 14px 10px;background:linear-gradient(#10080fee 85%,transparent);pointer-events:none}.brand{display:flex;align-items:center;gap:10px;text-shadow:0 2px 10px #000}.brand .skull{font-size:36px;filter:drop-shadow(0 0 9px #ed2819)}.brand strong{display:block;font-size:clamp(25px,7vw,36px);letter-spacing:2px;font-weight:1000;line-height:.9;color:#f5f0eb;text-shadow:2px 3px #ad271e,0 0 15px #fd451b}.brand small{color:#ff674d;letter-spacing:3px;font-weight:900;font-size:10px}.searchbar{margin-top:12px;display:flex;gap:7px;pointer-events:auto}.searchbar input{min-width:0;flex:1;background:#1c131bed;border:1px solid #8f342a;color:#fff;border-radius:12px;padding:13px;font-size:16px;box-shadow:0 4px 15px #0007}.searchbar button,.round,.action{background:linear-gradient(155deg,#a92c25,#531119);border:1px solid #ff6849;border-radius:12px;color:#fff;font-weight:900;padding:10px 13px;box-shadow:0 4px 16px #000a}.searchbar button{font-size:21px}.suggest{display:none;position:absolute;top:126px;left:14px;right:14px;background:#1c131bf5;border:1px solid #ff583f;border-radius:12px;max-height:40vh;overflow:auto;pointer-events:auto;box-shadow:0 12px 30px #000}.suggest button{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;border-bottom:1px solid #493037;padding:13px;font-size:14px}
.tools{position:absolute;z-index:900;right:12px;top:42%;display:grid;gap:9px}.round{width:49px;height:49px;font-size:23px;border-radius:50%;padding:0}.bottom{position:absolute;z-index:950;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:linear-gradient(140deg,#21141df5,#0e0a10f7);border:1px solid #ac4035;border-radius:19px;box-shadow:0 0 25px #000d,0 0 14px #f43b222f;padding:12px}.status{font-size:13px;color:#f5d7ce;min-height:18px}.status b{color:var(--gold)}.trip{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.trip strong{font-size:21px;color:#ffbf70}.trip span{font-size:12px;color:#c9b7b5}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.action{padding:9px 3px;font-size:11px;min-height:58px}.action i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}.action.active{background:linear-gradient(145deg,#fc5b28,#9c161b);box-shadow:0 0 12px #f50a}.panel{position:absolute;z-index:990;left:12px;right:12px;bottom:155px;background:#190e18f7;border:1px solid #df4933;border-radius:14px;padding:15px;display:none;max-height:43vh;overflow:auto;box-shadow:0 8px 35px #000}.panel h3{margin:0 0 8px;color:#ffab66}.panel p{font-size:13px;line-height:1.45}.panel button{margin:4px;background:#55222a;color:white;border:1px solid #c14b37;padding:9px;border-radius:8px}.close{float:right}.marker{font-size:26px;filter:drop-shadow(0 0 7px red)}.arrow{background:#ef3e2c;border:3px solid #fff;border-radius:50%;width:25px;height:25px;box-shadow:0 0 18px #ff3d18}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#20131a;color:white}#warning{position:absolute;z-index:1100;left:10px;right:10px;top:0;background:#451b1bee;color:white;font-size:11px;text-align:center;padding:3px;display:none}@media(max-height:600px){.brand strong{font-size:24px}.brand .skull{font-size:25px}.searchbar{margin-top:7px}.bottom{padding:8px}.trip{margin:5px 0}.action{min-height:43px}.action i{font-size:16px}}
</style><link rel="stylesheet" href="metal.css"></head><body><div id="map"></div><div class="top"><div class="brand"><div class="skull">☠</div><div><strong>HELLROAD</strong><small>GPS FROM HELL</small></div></div><div class="searchbar"><input id="query" autocomplete="off" placeholder="Où on roule ? Ville, adresse, salle…" aria-label="Destination"><button id="search" aria-label="Rechercher">⌕</button></div><div id="suggest" class="suggest"></div></div><div class="tools"><button class="round" id="locate" title="Ma position">⌖</button><button class="round" id="zoomIn" title="Zoom avant">＋</button><button class="round" id="zoomOut" title="Zoom arrière">−</button></div><div class="panel" id="panel"><button class="close" id="close">✕</button><div id="panelContent"></div></div><div class="bottom"><div class="status" id="status">☠ <b>HELLROAD</b> — choisis une destination pour tracer ta route.</div><div class="trip"><div><div><strong id="distance">— km</strong><br><span>DISTANCE</span></div></div><div><strong id="duration">— min</strong><br><span>ESTIMATION</span></div><div><strong id="speed">— km/h</strong><br><span>VITESSE GPS</span></div></div><div class="actions"><button class="action active" id="gps"><i>➤</i>GPS</button><button class="action" id="alerts"><i>⚠</i>ALERTES</button><button class="action" id="concerts"><i>🤘</i>CONCERTS</button><button class="action" id="radio"><i>♫</i>RADIO</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{const $=id=>document.getElementById(id), status=$('status'),map=L.map('map',{zoomControl:false}).setView([47.08,-1.13],11);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors © CARTO'}).addTo(map);let current=null,destination=null,route=null,meMarker=null,destMarker=null,watch=null;const note=s=>status.textContent=s;function panel(html){$('panelContent').innerHTML=html;$('panel').style.display='block'}$('close').onclick=()=>{$('panel').style.display='none'};function position(p){current=[p.coords.latitude,p.coords.longitude];$('speed').textContent=p.coords.speed!=null?Math.round(p.coords.speed*3.6)+' km/h':'— km/h';if(!meMarker){meMarker=L.marker(current,{icon:L.divIcon({className:'',html:'<div class="arrow"></div>',iconSize:[25,25]})}).addTo(map)}else meMarker.setLatLng(current);if(!destination)map.setView(current,14);note('Position GPS reçue. '+(destination?'Destination sélectionnée.':'Recherche une destination.'))}function geoError(){note('Géolocalisation indisponible : autorise la position dans ton navigateur.')}function locate(){if(!navigator.geolocation){geoError();return}if(watch==null)watch=navigator.geolocation.watchPosition(position,geoError,{enableHighAccuracy:true,maximumAge:3000,timeout:12000});else navigator.geolocation.getCurrentPosition(p=>{position(p);map.setView(current,15)},geoError,{enableHighAccuracy:true})}$('locate').onclick=locate;$('zoomIn').onclick=()=>map.zoomIn();$('zoomOut').onclick=()=>map.zoomOut();async function find(){const q=$('query').value.trim();if(q.length<3){note('Entre au moins 3 caractères.');return}note('Recherche de destination…');try{const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=fr&q='+encodeURIComponent(q));if(!res.ok)throw Error('Recherche indisponible');const data=await res.json();const box=$('suggest');box.replaceChildren();if(!data.length){note('Aucun résultat trouvé.');box.style.display='none';return}data.forEach(item=>{const b=document.createElement('button');b.textContent=item.display_name;b.onclick=()=>{destination=[+item.lat,+item.lon];$('query').value=item.display_name.split(',').slice(0,2).join(',');box.style.display='none';if(destMarker)destMarker.remove();destMarker=L.marker(destination,{icon:L.divIcon({className:'marker',html:'📍',iconSize:[30,35]})}).addTo(map);map.setView(destination,13);note('Destination choisie. Calcul de la route…');calculate()};box.append(b)});box.style.display='block';note('Choisis une destination dans les résultats.')}catch(e){note('Recherche indisponible. Vérifie ta connexion.')}}$('search').onclick=find;$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();find()}});async function calculate(){if(!current){note('Destination choisie. Active la localisation ⌖ pour calculer le trajet.');return}if(!destination)return;try{const url='https://router.project-osrm.org/route/v1/driving/'+current[1]+','+current[0]+';'+destination[1]+','+destination[0]+'?overview=full&geometries=geojson&steps=false';const res=await fetch(url);if(!res.ok)throw Error('Service de trajet indisponible');const data=await res.json();if(!data.routes?.length)throw Error('Pas de trajet trouvé');const r=data.routes[0];if(route)route.remove();route=L.geoJSON(r.geometry,{style:{color:'#ff4228',weight:7,opacity:.96,lineCap:'round'}}).addTo(map);map.fitBounds(route.getBounds(),{paddingTopLeft:[25,150],paddingBottomRight:[25,200]});$('distance').textContent=(r.distance/1000).toFixed(1).replace('.',',')+' km';$('duration').textContent=Math.round(r.duration/60)+' min';note('Route calculée. Démonstration : pas de guidage vocal ni trafic temps réel.')}catch(e){note('Calcul de trajet indisponible : '+e.message)}}$('gps').onclick=()=>{document.querySelectorAll('.action').forEach(b=>b.classList.remove('active'));$('gps').classList.add('active');$('panel').style.display='none';if(destination)calculate();else locate()};$('alerts').onclick=()=>panel('<h3>⚠ Alertes de la route</h3><p>Module de démonstration : aucune alerte communautaire en temps réel n’est encore disponible.</p><p>Les dangers et travaux devront venir d’une source vérifiée avant une utilisation routière.</p>');$('concerts').onclick=()=>panel('<h3>🤘 Concerts & festivals</h3><p>À venir : recherche des salles, festivals et concerts rock-metal autour de ton itinéraire.</p><p>Aucune donnée d’événement n’est encore connectée.</p>');$('radio').onclick=()=>panel('<h3>♫ Radio metal</h3><p>Le lecteur radio sera ajouté après validation des flux et des droits de diffusion.</p><p>Cette démonstration ne lance pas de musique.</p>');if(location.protocol==='https:'||location.hostname==='localhost'){locate()}else note('Pour utiliser le GPS, ouvre cette application sur une adresse HTTPS.');})();
</script><script src="navigation.js"></script></body></html>
