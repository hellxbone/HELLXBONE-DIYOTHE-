</style></head><body>
<main class="wrap">
<header class="top"><button id="back" class="back" type="button">← RETOUR</button><h1 class="brand">HELLX SIGNAL</h1><span aria-hidden="true">☠</span></header>
<p class="intro">Montre ton message même quand personne ne peut t'entendre.</p>
<section id="display" class="display" aria-live="polite"><strong id="message">J'AI BESOIN D'AIDE</strong></section>
<div class="actions"><button id="large" class="primary" type="button">PLEIN ÉCRAN</button><button id="flash" class="small" type="button" aria-pressed="false">FLASH : OFF</button></div>
<span class="label">Messages immédiats</span>
<div id="presets" class="grid"></div>
<div class="controls"><label for="lang">Langue :</label><select id="lang"><option value="fr">Français</option><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option></select></div>
<p class="sos-note">Le signal SOS est seulement visuel : il n'appelle pas les secours. En urgence, contacte les services d'urgence (112 en Europe) si tu le peux.</p>

</main>
<button class="exit-presentation" id="exit" type="button" aria-label="Quitter le plein écran">✕ RETOUR</button>
<script>
(()=>{'use strict';
const sentences=[
{id:'help',color:'sos',fr:"J'AI BESOIN D'AIDE",en:"I NEED HELP",de:"ICH BRAUCHE HILFE",es:"NECESITO AYUDA"},
{id:'sit',color:'',fr:"JE DOIS M'ASSEOIR",en:"I NEED TO SIT DOWN",de:"ICH MUSS MICH HINSETZEN",es:"NECESITO SENTARME"},
{id:'exit',color:'warn',fr:"JE CHERCHE UNE SORTIE",en:"WHERE IS THE EXIT?",de:"WO IST DER AUSGANG?",es:"¿DÓNDE ESTÁ LA SALIDA?"},
{id:'toilet',color:'',fr:"JE CHERCHE LES TOILETTES",en:"WHERE ARE THE TOILETS?",de:"WO SIND DIE TOILETTEN?",es:"¿DÓNDE ESTÁ EL BAÑO?"},
{id:'pass',color:'warn',fr:"LAISSEZ-MOI PASSER",en:"PLEASE LET ME THROUGH",de:"BITTE LASSEN SIE MICH DURCH",es:"DÉJENME PASAR"},
{id:'sos',color:'sos',fr:"SOS — APPELEZ LES SECOURS",en:"SOS — CALL EMERGENCY SERVICES",de:"SOS — RUFEN SIE DEN NOTRUF",es:"SOS — LLAMEN A EMERGENCIAS"}
];
const $=id=>document.getElementById(id),display=$('display'),message=$('message'),lang=$('lang');let chosen={type:'preset',id:'help'},flashing=false,wakeLock=null;
const list=$('presets');sentences.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='preset'+(item.color==='sos'?' alert':'');b.dataset.id=item.id;b.textContent=item.fr;b.addEventListener('click',()=>{chosen={type:'preset',id:item.id};flashing=item.id==='sos';render()});list.append(b)});
function current(){const m=sentences.find(s=>s.id===chosen.id)||sentences[0];return{text:m[lang.value]||m.fr,color:m.color,language:lang.value}}
function render(){const m=current();message.textContent=m.text;display.className='display'+(m.color?' '+m.color:'')+(flashing?' flash':'');$('flash').textContent='FLASH : '+(flashing?'ON':'OFF');$('flash').setAttribute('aria-pressed',String(flashing));list.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.id===chosen.id);b.setAttribute('aria-pressed',String(b.dataset.id===chosen.id))})}
lang.addEventListener('change',render);
$('flash').addEventListener('click',()=>{flashing=!flashing;$('flash').textContent='FLASH : '+(flashing?'ON':'OFF');$('flash').setAttribute('aria-pressed',String(flashing));render()});
async function enter(){document.body.classList.add('presentation');window.scrollTo(0,0);try{wakeLock=await navigator.wakeLock?.request('screen')}catch{}}
async function leave(){document.body.classList.remove('presentation');if(document.fullscreenElement)try{await document.exitFullscreen()}catch{}if(wakeLock)try{await wakeLock.release()}catch{}wakeLock=null}
$('large').addEventListener('click',enter);$('exit').addEventListener('click',leave);
document.addEventListener('keydown',e=>{if(e.key==='Escape')leave()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('presentation'))document.body.classList.remove('presentation')});
$('back').addEventListener('click',()=>{if(window.parent!==window&&new URLSearchParams(location.search).has('embedded')){window.parent.postMessage('hellx-signal-close',location.origin)}else{location.href='./'}});
render();
})();
</script>

<script id="hellx-signal-artwork-controller">
(()=>{
'use strict';
const source='./assets/hellx-signal-design.jpg';
const art=document.createElement('div');art.className='hxs-art';
art.setAttribute('aria-label','HELLX SIGNAL, design rock metal interactif');
const im=document.createElement('img');im.src=source;im.alt='Habillage infernal HELLX SIGNAL en vert néon et métal noir';
const hit=(key,label)=>{const b=document.createElement('button');b.type='button';b.className='hxs-hit';b.dataset.hxs=key;b.setAttribute('aria-label',label);art.append(b);return b};
art.append(im);
const actions={back:'Retour à l’accueil',large:'Afficher le message en plein écran',flash:'Activer ou désactiver le flash',
help:'J’ai besoin d’aide',sit:'Je dois m’asseoir',exit:'Je cherche une sortie',toilet:'Je cherche les toilettes',
pass:'Laissez-moi passer',sos:'SOS — appelez les secours'};
Object.entries(actions).forEach(([key,label])=>hit(key,label));
const translation=document.createElement('div');translation.className='hxs-translation';translation.setAttribute('aria-live','polite');art.append(translation);
const on=document.createElement('div');on.className='hxs-flash-on';on.textContent='FLASH : ON';art.append(on);
const select=document.createElement('select');select.setAttribute('aria-label','Langue des messages');
select.innerHTML=document.getElementById('lang').innerHTML;art.append(select);
document.body.insertBefore(art,document.querySelector('main.wrap'));
function sync(){
const active=document.querySelector('#presets .preset.active');
const key=active?.dataset.id||'help';
const language=document.getElementById('lang').value;
const message=document.getElementById('message').textContent;
const flashing=document.getElementById('flash').getAttribute('aria-pressed')==='true';
const defaultImage=key==='help'&&language==='fr';
translation.classList.toggle('visible',!defaultImage);
translation.textContent=message;
translation.style.color=(key==='sos'||key==='help')?'#ff3748':'#aaff9a';
on.classList.toggle('visible',flashing);
select.value=language;
art.querySelectorAll('.hxs-hit').forEach(b=>b.removeAttribute('data-hxs-selected'));
}
art.addEventListener('click',e=>{
const b=e.target.closest('.hxs-hit');if(!b)return;
const key=b.dataset.hxs;
const original=['back','large','flash'].includes(key)?document.getElementById(key):document.querySelector('#presets [data-id="'+key+'"]');
original?.click();sync();
});
select.addEventListener('change',()=>{const actual=document.getElementById('lang');actual.value=select.value;actual.dispatchEvent(new Event('change',{bubbles:true}));sync()});
const originalMessage=document.getElementById('message');new MutationObserver(sync).observe(originalMessage,{childList:true,characterData:true,subtree:true});
new MutationObserver(sync).observe(document.getElementById('flash'),{attributes:true,attributeFilter:['aria-pressed']});
im.addEventListener('load',()=>{if(im.naturalWidth>0){document.body.classList.add('hxs-art-ready');sync()}});
im.addEventListener('error',()=>{document.body.classList.remove('hxs-art-ready')});
if(im.complete&&im.naturalWidth>0){document.body.classList.add('hxs-art-ready');sync()}
})();
</script>
