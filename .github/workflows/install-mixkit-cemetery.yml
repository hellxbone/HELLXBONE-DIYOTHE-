name: Install real Mixkit cemetery film
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mixkit-cemetery.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download the actual Mixkit clip 101588
        shell: bash
        run: |
          mkdir -p assets
          set -euo pipefail
          for url in \
            'https://assets.mixkit.co/videos/101588/101588-video-720.mp4' \
            'https://assets.mixkit.co/videos/preview/mixkit-hand-rising-from-grave-101588-large.mp4' \
            'https://assets.mixkit.co/videos/101588/101588-video-1080.mp4'; do
            if curl -fL --retry 2 --max-time 35 "$url" -o /tmp/mixkit-101588.mp4 && \
               ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 /tmp/mixkit-101588.mp4 | grep -q '[0-9]'; then
              echo "Valid clip downloaded"
              break
            fi
          done
          test -s /tmp/mixkit-101588.mp4
          ffprobe -v error -show_entries format=duration /tmp/mixkit-101588.mp4
      - name: Convert real footage into green phosphor DMD
        run: |
          ffmpeg -hide_banner -loglevel error -y -i /tmp/mixkit-101588.mp4 -vf "fps=15,scale=256:106:force_original_aspect_ratio=increase,crop=256:106,format=gray,eq=contrast=1.7:brightness=-0.035,format=rgb24,lutrgb=r='val*0.25':g='val':b='val*0.45',scale=256:106:flags=neighbor" -an -c:v libvpx-vp9 -b:v 350k -crf 35 -deadline good -cpu-used 5 assets/hellxbone-cemetery.webm
          test -s assets/hellxbone-cemetery.webm
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hellxbone-cemetery.webm
          if ! git diff --cached --quiet; then
            git commit -m "Install authentic Mixkit hand rising from grave film as DMD radio video"
            git push
          fi
