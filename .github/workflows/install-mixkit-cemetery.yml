name: Install real Mixkit cemetery film
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mixkit-cemetery.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download official Mixkit MP4
        run: |
          mkdir -p assets
          python - <<'PY'
          import requests,re,html,subprocess
          base='https://mixkit.co/free-stock-video/hand-rising-from-grave-101588/'
          links=['https://mixkit.co/free-stock-video/download/101588/',
                 'https://mixkit.co/free-stock-video/download/101588/?resolution=720',
                 'https://assets.mixkit.co/videos/preview/mixkit-hand-rising-from-grave-101588-large.mp4']
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':base})
          try:
            page=session.get(base,timeout=20).text
            links=re.findall(r'https?[^"\\s<>]+(?:\\.mp4|/download/[^"\\s<>]+)',html.unescape(page))+links
          except Exception as exc:print('Discovery:',exc)
          for url in links:
            try:
              r=session.get(url,timeout=35)
              if len(r.content)<120000 or b'ftyp' not in r.content[:128]:
                print('Invalid MP4:',r.status_code,url[:100]);continue
              open('/tmp/mixkit-101588.mp4','wb').write(r.content)
              subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width','-of','csv=p=0','/tmp/mixkit-101588.mp4'],check=True)
              print('Downloaded:',url,len(r.content));break
            except Exception as e:print('Failed:',str(e)[:120])
          else:raise SystemExit('Could not fetch MP4 from provider')
          PY
      - name: Convert real footage into green phosphor DMD
        run: |
          ffmpeg -hide_banner -loglevel error -y -i /tmp/mixkit-101588.mp4 -vf "fps=18,scale=768:318:force_original_aspect_ratio=increase,crop=768:318,format=gray,eq=contrast=1.7:brightness=-0.035,format=rgb24,lutrgb=r='val*0.25':g='val':b='val*0.45'" -an -c:v libvpx-vp9 -b:v 350k -crf 35 -deadline good -cpu-used 5 assets/hellxbone-cemetery.webm
          test -s assets/hellxbone-cemetery.webm
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hellxbone-cemetery.webm
          if ! git diff --cached --quiet; then
            git commit -m "Install authentic Mixkit hand rising from grave film as DMD radio video"
            git push
          fi
