name: Build CRORIF photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-crorif-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild optimized CRORIF image
        run: |
          cat .crorif-photo/part*.txt | tr -d '\n\r' | base64 -d > crorif-portrait.webp
          test "$(stat -c%s crorif-portrait.webp)" -eq 22386
          file crorif-portrait.webp
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crorif-portrait.webp
          git diff --cached --quiet || git commit -m "Ajoute la photo optimisée de CRORIF"
          git push
