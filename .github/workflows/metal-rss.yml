name: Actualiser les news metal RSS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/metal-rss.yml'
      - 'scripts/update_rss.py'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: rss-news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Charger le RSS
        run: python scripts/update_rss.py
      - name: Publier seulement si les articles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metal-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les actualités RSS Metalorgie"
            git push
          fi
