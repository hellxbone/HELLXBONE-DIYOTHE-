name: HELLXBONE RSS share cards
on:
  push:
    branches: [main]
    paths:
      - metal-news.json
      - scripts/generate_rss_share.py
      - .github/workflows/rss-share-cards.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  share-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - run: python scripts/generate_rss_share.py
      - name: Commit cards and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metal-news.json rss-share/
          if ! git diff --cached --quiet; then
            git commit -m "Generate RSS share cards [skip ci]"
            git push
          fi
