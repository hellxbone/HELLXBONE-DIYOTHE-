name: HELLXBONE radio track metadata
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radio-metadata
  cancel-in-progress: false
jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read radio station metadata
        run: python scripts/radio_metadata.py
      - name: Publish when metadata changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio-nowplaying.json
          git diff --cached --quiet || (git commit -m "Actualiser les titres des radios HELLXBONE" && git push)
