name: Build HELLXBONE DMD film
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_hellxbone_dmd.py'
      - '.github/workflows/build-dmd.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          python -m pip install --quiet numpy opencv-python-headless
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render animated movie
        run: python scripts/build_hellxbone_dmd.py
      - name: Check movie
        run: |
          test -s assets/hellxbone-cemetery.webm
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/hellxbone-cemetery.webm
      - name: Publish film to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hellxbone-cemetery.webm
          if ! git diff --cached --quiet; then
            git commit -m "Render and publish HELLXBONE cemetery DMD film"
            git push
          fi
