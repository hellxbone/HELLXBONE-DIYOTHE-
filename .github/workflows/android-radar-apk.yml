name: Build HELLXBONE Android radar APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-radar/**'
      - '.github/workflows/android-radar-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build free debug APK
        working-directory: android-radar
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HELLXBONE-radar-Android-APK
          path: android-radar/app/build/outputs/apk/debug/app-debug.apk
