<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070507"><title>HELLXBONE PINBALL — Le Trône des Enfers</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050305;color:#ffe8cb;font-family:system-ui,Arial,sans-serif;overflow:hidden}#shell{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 20%,#4d140a,#090308 72%)}#top{width:100%;max-width:600px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:8px 10px;font-size:12px;font-weight:900;color:#ffd8a3;text-shadow:0 0 10px #f40}#top strong{font-size:17px;color:#ffb443}#stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}canvas{height:100%;max-width:100%;touch-action:none;display:block;box-shadow:0 0 36px #d1261944;border:2px solid #583a25;border-radius:12px;background:#0b0609}#controls{display:grid;grid-template-columns:1fr 1fr 1fr;width:min(100%,600px);gap:10px;padding:8px 12px max(10px,env(safe-area-inset-bottom));height:88px}button{border:2px solid #b96337;border-radius:15px;background:linear-gradient(#502316,#10070a);color:#ffddad;font-size:19px;font-weight:1000;box-shadow:inset 0 1px #fba64a,0 3px 16px #ec3a2833;touch-action:none;cursor:pointer}button:active,button.on{background:linear-gradient(#dd5b21,#672008);box-shadow:0 0 26px #ff6a19}#start{font-size:14px}#overlay{position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);width:min(84vw,365px);padding:24px;background:linear-gradient(140deg,#230a0b,#050505);border:2px solid #ba642e;border-radius:15px;text-align:center;box-shadow:0 0 0 300vmax #0008,0 0 65px #ec330e77}#overlay h1{font:900 32px Georgia,serif;color:#ffad56;text-shadow:0 0 20px #fb411d;margin:0 0 8px}#overlay p{line-height:1.5}#overlay button{padding:15px;width:100%}#overlay[hidden]{display:none}a{color:#fcb86a}</style></head><body><div id="shell"><header id="top"><span>SCORE<br><strong id="score">0</strong></span><span style="text-align:center">HELLXBONE<br><small style="color:#f45">LE TRÔNE DES ENFERS</small></span><span style="text-align:right">BALLES<br><strong id="balls">3</strong></span></header><div id="stage"><canvas id="field" width="420" height="730" aria-label="Plateau du flipper infernal"></canvas><div id="overlay"><h1>PINBALL 666</h1><p>Le Trône des Enfers<br>3 billes • 2 flippers • rampes • combos • MULTIBALL</p><p>Appuie à gauche ou à droite pour frapper. Touche LANCER pour tirer une bille.</p><button id="begin">ENTRER EN ENFER</button><p style="font-size:12px"><a href="./#jeu">Retour aux jeux HELLXBONE</a></p></div></div><div id="controls"><button id="left">◀ GAUCHE</button><button id="start">LANCER<br>LA BILLE</button><button id="right">DROITE ▶</button></div></div><script>
(()=>{'use strict';
const c=document.querySelector('#field'),ctx=c.getContext('2d'),stage=document.querySelector('#stage'),scoreEl=document.querySelector('#score'),ballsEl=document.querySelector('#balls'),overlay=document.querySelector('#overlay');let score=0,remaining=3,playing=false,launched=false,left=false,right=false,multiball=0,combo=0,shake=0,flash=0,t=0,last=0;let balls=[],sparks=[];const W=420,H=730;
function fit(){let w=stage.clientWidth,h=stage.clientHeight;c.style.width=Math.min(w,h*W/H)+'px';c.style.height=Math.min(h,w*H/W)+'px'}addEventListener('resize',fit);fit();
let audio;function sound(f=220,d=.07,type='sawtooth'){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(70,f/2),audio.currentTime+d);g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function points(n,x,y){score+=n*(1+Math.min(9,Math.floor(combo/6)));scoreEl.textContent=score.toLocaleString('fr-FR');combo++;flash=12;for(let i=0;i<14;i++)sparks.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,l:24,r:Math.random()*3+1});sound(220+Math.random()*520);if(combo%12===0&&balls.length<3){balls.push({x:210,y:190,vx:Math.random()*8-4,vy:-5,r:8});multiball=120;}}
function newBall(){if(!playing||launched)return;balls.push({x:381,y:655,vx:-1,vy:-19,r:8});launched=true;sound(130,.28)}
function reset(){score=0;remaining=3;combo=0;balls=[];sparks=[];playing=true;launched=false;overlay.hidden=true;scoreEl.textContent='0';ballsEl.textContent='3';sound(120,.2)}
document.querySelector('#begin').onclick=()=>{reset();newBall()};document.querySelector('#start').onclick=()=>{if(!playing)reset();newBall()};
function bind(id,side){let b=document.getElementById(id);const set=v=>{if(side==='l')left=v;else right=v;b.classList.toggle('on',v);if(v)sound(140,.035,'triangle')};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});for(let evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>set(false))}
bind('left','l');bind('right','r');document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')left=true;if(e.code==='ArrowRight'||e.code==='KeyD')right=true;if(e.code==='Space'){e.preventDefault();if(!playing)reset();newBall()}});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')left=false;if(e.code==='ArrowRight'||e.code==='KeyD')right=false});
c.addEventListener('pointerdown',e=>{let x=e.offsetX/c.clientWidth;if(x<.5)left=true;else right=true});c.addEventListener('pointerup',()=>{left=false;right=false});c.addEventListener('pointercancel',()=>{left=false;right=false});
const bumpers=[{x:145,y:230,r:28},{x:274,y:230,r:28},{x:210,y:290,r:29}],posts=[{x:70,y:515,r:16},{x:350,y:515,r:16},{x:210,y:396,r:15},{x:98,y:360,r:11},{x:323,y:362,r:11}];
function circle(x,y,r,col,blur=0){ctx.shadowBlur=blur;ctx.shadowColor=col;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.shadowBlur=0}
function segment(x1,y1,x2,y2,width,color){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function collisionSegment(b,x1,y1,x2,y2,power=1){let dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy,u=Math.max(0,Math.min(1,((b.x-x1)*dx+(b.y-y1)*dy)/l2)),px=x1+dx*u,py=y1+dy*u,nx=b.x-px,ny=b.y-py,dist=Math.hypot(nx,ny);if(dist<b.r+5&&dist>.0001){nx/=dist;ny/=dist;b.x=px+nx*(b.r+5);b.y=py+ny*(b.r+5);let dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=1.83*dot*nx;b.vy-=1.83*dot*ny}b.vx+=nx*power;b.vy+=ny*power;return true}return false}
function step(){if(!playing)return;for(let b of [...balls]){for(let n=0;n<2;n++){b.vy+=.18;b.x+=b.vx*.5;b.y+=b.vy*.5;b.vx*=.999;b.vy*=.999;if(b.x<28){b.x=28;b.vx=Math.abs(b.vx)*.85}if(b.x>390){b.x=390;b.vx=-Math.abs(b.vx)*.85}if(b.y<78){b.y=78;b.vy=Math.abs(b.vy)}collisionSegment(b,25,505,110,625,1);collisionSegment(b,395,505,310,625,1);collisionSegment(b,25,80,25,490);collisionSegment(b,395,80,395,495);for(let p of [...bumpers,...posts]){let dx=b.x-p.x,dy=b.y-p.y,dist=Math.hypot(dx,dy);if(dist<p.r+b.r&&dist>0){let nx=dx/dist,ny=dy/dist;b.x=p.x+nx*(p.r+b.r);b.y=p.y+ny*(p.r+b.r);let v=b.vx*nx+b.vy*ny;b.vx-=2*v*nx;b.vy-=2*v*ny;b.vx+=nx*2.2;b.vy+=ny*2.2;if(b.cooldown!==p){points(bumpers.includes(p)?250:100,p.x,p.y);b.cooldown=p;shake=4}}}
const ly=652,by=left?614:652,ry=right?614:652;
if(collisionSegment(b,108,ly,195,by,left?9:2)){if(left){b.vy=-Math.abs(b.vy)-5;b.vx=4+Math.random()*3;points(35,b.x,b.y)}}
if(collisionSegment(b,312,ly,225,ry,right?9:2)){if(right){b.vy=-Math.abs(b.vy)-5;b.vx=-4-Math.random()*3;points(35,b.x,b.y)}}
if(b.y>740){balls.splice(balls.indexOf(b),1);if(!balls.length){remaining--;ballsEl.textContent=remaining;launched=false;combo=0;if(remaining<=0){playing=false;overlay.hidden=false;overlay.querySelector('h1').textContent='GAME OVER';overlay.querySelector('p').innerHTML='Score : '+score.toLocaleString('fr-FR')+' points<br>Le trône attend ton retour.';overlay.querySelector('#begin').textContent='REJOUER';}else sound(95,.4)}}}
b.vx=Math.max(-13,Math.min(13,b.vx));b.vy=Math.max(-21,Math.min(18,b.vy));}b.cooldown=null}}
function draw(){t++;let sh=shake>0?(Math.random()-.5)*shake:0;shake*=.85;ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(sh,0);
let grad=ctx.createLinearGradient(0,0,420,730);grad.addColorStop(0,'#35101b');grad.addColorStop(.48,'#130d14');grad.addColorStop(1,'#2e0d08');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
for(let i=0;i<18;i++){let x=(i*79)%420,y=(i*143)%730;segment(x,y,x+55,y-70,1,'#8b2d1933')}
ctx.strokeStyle='#ad5f2d';ctx.lineWidth=12;ctx.strokeRect(18,56,385,655);ctx.strokeStyle='#f7501c';ctx.lineWidth=2;ctx.shadowColor='#ff4b12';ctx.shadowBlur=14;ctx.strokeRect(21,59,379,650);ctx.shadowBlur=0;
ctx.textAlign='center';ctx.font='900 40px Georgia';ctx.fillStyle='#bd754a';ctx.shadowColor='#e93211';ctx.shadowBlur=20;ctx.fillText('☠',210,151);ctx.shadowBlur=0;ctx.font='bold 16px Georgia';ctx.fillStyle='#fb9149';ctx.fillText('TRÔNE DES ENFERS',210,177);
for(let j=0;j<3;j++){ctx.strokeStyle=j%2?'#ff5a24':'#83f524';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=11;ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(210,325,173-j*17,260-j*25,0,Math.PI*1.12,Math.PI*1.87);ctx.stroke();ctx.shadowBlur=0}
for(let i=0;i<9;i++){let x=61+i%3*150,y=410+Math.floor(i/3)*45;circle(x,y,3,i%2?'#80ff60':'#ff742c',8)}
for(let p of bumpers){circle(p.x,p.y,p.r+7,'#4f1c13',9);circle(p.x,p.y,p.r,'#d26925',14);circle(p.x,p.y,p.r-5,'#23120d');ctx.fillStyle='#a3ff68';ctx.font='bold 27px Georgia';ctx.fillText('☠',p.x,p.y+9);ctx.strokeStyle='#ffe18a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke()}
for(let p of posts){circle(p.x,p.y,p.r+3,'#ba401b',8);circle(p.x,p.y,p.r,'#31100f');circle(p.x,p.y,p.r*.55,'#ff7f27',8)}
ctx.fillStyle='#e5a663';ctx.font='bold 27px Georgia';ctx.fillText('666',210,466);ctx.font='bold 12px system-ui';ctx.fillStyle='#93ff66';ctx.fillText(multiball>0?'MULTIBALL INFERNAL':'CHAOS • MULTIBALL • JACKPOT',210,492);
segment(25,505,110,625,8,'#9b3f22');segment(395,505,310,625,8,'#9b3f22');
for(let [x1,y1,x2,y2,on] of [[108,652,195,left?614:652,left],[312,652,225,right?614:652,right]]){segment(x1,y1,x2,y2,20,'#090606');segment(x1,y1,x2,y2,13,on?'#ffb54e':'#c9784d');segment(x1,y1,x2,y2,3,'#fff4c2')}
circle(110,652,12,'#5d2e21');circle(312,652,12,'#5d2e21');ctx.fillStyle='#ff7a31';ctx.font='bold 13px system-ui';ctx.fillText('HELLXBONE',210,695);
for(let b of balls){circle(b.x-3,b.y-3,13,'#ff5e2033',17);let g=ctx.createRadialGradient(b.x-3,b.y-4,1,b.x,b.y,10);g.addColorStop(0,'#fff');g.addColorStop(.28,'#fff1bc');g.addColorStop(.7,'#adbed0');g.addColorStop(1,'#3c4249');circle(b.x,b.y,9,g,9)}
for(let p of sparks){circle(p.x,p.y,p.r,'#ffbb52',8);p.x+=p.vx;p.y+=p.vy;p.l--}sparks=sparks.filter(p=>p.l>0);if(flash>0){ctx.fillStyle='rgba(255,94,25,'+(flash/110)+')';ctx.fillRect(0,0,W,H);flash--}if(multiball>0)multiball--;ctx.restore();}
function loop(now){let dt=Math.min(35,now-last);last=now;step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
