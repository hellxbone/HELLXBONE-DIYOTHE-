<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09070a"><title>HELLXBONE — FLIPPER : LE TRÔNE DES ENFERS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060509;color:#eee;font-family:system-ui,Arial,sans-serif;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 40%,#37101a,#050406 75%)}header{height:55px;width:min(100%,600px);display:flex;align-items:center;justify-content:space-between;padding:5px 14px;font-size:12px;font-weight:900;letter-spacing:.6px}header b{display:block;color:#ffaf62;font-size:21px;line-height:1.1}header .brand{text-align:center;color:#eee;font-size:15px}header .brand small{display:block;color:#eb422f;font-size:10px}#stage{flex:1;min-height:0;position:relative;width:100%;display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100%;max-height:100%;touch-action:none;filter:drop-shadow(0 0 18px #ad321e55);border-radius:15px}#controls{height:98px;width:min(100%,620px);display:grid;grid-template-columns:1fr .88fr 1fr;gap:9px;padding:8px 10px max(12px,env(safe-area-inset-bottom))}button{border:2px solid #bc653e;border-radius:16px;background:linear-gradient(165deg,#512419,#130b13);color:#ffe1c0;box-shadow:inset 0 2px #f7b36f77,0 5px 16px #000;font-weight:900;font-size:17px;touch-action:none;user-select:none}button.active{background:linear-gradient(#f07735,#762719);box-shadow:0 0 22px #f70}#launch{font-size:14px}#modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;width:min(88vw,365px);border:2px solid #c56a3f;border-radius:20px;background:linear-gradient(135deg,#36131b,#080608);box-shadow:0 0 0 200vmax #0009,0 0 50px #e33b2266;padding:24px;text-align:center}#modal[hidden]{display:none}#modal h1{color:#fdb96b;text-shadow:0 0 15px #fe431c;font:900 30px Georgia,serif;margin:2px 0 12px}#modal p{line-height:1.5;font-size:15px}#modal button{width:100%;padding:16px;margin-top:8px}#modal a{display:inline-block;margin-top:18px;color:#ffa971}
</style></head><body><div id="app"><header><div>SCORE<b id="score">0</b></div><div class="brand">HELLXBONE<small>LE TRÔNE DES ENFERS</small></div><div style="text-align:right">BILLES<b id="count">3</b></div></header><div id="stage"><canvas id="game" width="450" height="760" aria-label="Flipper HELLXBONE jouable"></canvas><div id="modal"><h1>LE TRÔNE DES ENFERS</h1><p>Un flipper infernal : 3 billes, rampes, cibles, combos, jackpots et multiball.</p><p>Maintiens GAUCHE ou DROITE pour activer les batteurs. Lance la bille avec le bouton central.</p><button id="play">ENTRER EN ENFER</button><a href="./#jeu">Retour aux jeux</a></div></div><div id="controls"><button id="left">◀ GAUCHE</button><button id="launch">LANCER<br>LA BILLE</button><button id="right">DROITE ▶</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),c=canvas.getContext('2d'),stage=document.getElementById('stage'),modal=document.getElementById('modal'),scoreNode=document.getElementById('score'),countNode=document.getElementById('count');
const W=450,H=760;let playing=false,ready=false,score=0,remaining=3,combo=0,hitCount=0,left=false,right=false,balls=[],particles=[],texts=[],shimmer=0,shake=0,multitimer=0,last=0,accum=0,clock=0,context;
const bump=[{x:153,y:256,r:29,col:'#ff6537',label:'666'},{x:295,y:257,r:29,col:'#a0fd3b',label:'HELL'},{x:224,y:338,r:31,col:'#edba60',label:'X'}];
const posts=[{x:96,y:450,r:13},{x:350,y:450,r:13},{x:76,y:573,r:13},{x:375,y:573,r:13}];
const rails=[[39,92,39,568],[411,92,411,570],[39,570,123,664],[411,570,327,664],[65,122,108,94],[385,122,342,94]];
const rng=(a,b)=>a+Math.random()*(b-a);
function fit(){const s=Math.min(stage.clientWidth/W,stage.clientHeight/H);canvas.style.width=W*s+'px';canvas.style.height=H*s+'px'}addEventListener('resize',fit);fit();
function audio(f=260,d=.09){try{context??=new (window.AudioContext||window.webkitAudioContext)();context.resume();let o=context.createOscillator(),g=context.createGain();o.type='triangle';o.frequency.setValueAtTime(f,context.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(50,f*.55),context.currentTime+d);g.gain.setValueAtTime(.065,context.currentTime);g.gain.exponentialRampToValueAtTime(.0001,context.currentTime+d);o.connect(g);g.connect(context.destination);o.start();o.stop(context.currentTime+d)}catch(e){}}
function update(){scoreNode.textContent=score.toLocaleString('fr-FR');countNode.textContent=remaining}
function award(n,x,y,msg){combo++;let earned=n*(1+Math.min(5,Math.floor(combo/5)));score+=earned;update();shimmer=12;shake=3;texts.push({x,y,text:msg||'+'+earned,life:65});for(let i=0;i<17;i++)particles.push({x,y,vx:rng(-5,5),vy:rng(-6,2),life:rng(15,35)});audio(300+Math.min(1100,combo*45));hitCount++;if(hitCount%14===0&&balls.length<3){balls.push({x:224,y:160,vx:rng(-4,4),vy:-5,r:9,cool:0});multitimer=260;texts.push({x:224,y:170,text:'MULTIBALL !',life:100});}}
function start(){playing=true;ready=true;score=0;remaining=3;combo=0;hitCount=0;balls=[];particles=[];texts=[];modal.hidden=true;update();audio(145,.25)}
function launch(){if(!playing)start();if(!ready)return;ready=false;balls.push({x:394,y:662,vx:-2.8,vy:-20,r:9,cool:0});audio(105,.3)}
document.getElementById('play').onclick=()=>{start();launch()};document.getElementById('launch').onclick=launch;
function bind(id,side){const el=document.getElementById(id);const set=v=>{if(side==='l')left=v;else right=v;el.classList.toggle('active',v);if(v)audio(195,.05)};el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);set(true)});['pointerup','pointercancel','lostpointercapture'].forEach(k=>el.addEventListener(k,()=>set(false)))}
bind('left','l');bind('right','r');
document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')left=true;if(e.code==='ArrowRight'||e.code==='KeyD')right=true;if(e.code==='Space'){e.preventDefault();launch()}});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')left=false;if(e.code==='ArrowRight'||e.code==='KeyD')right=false});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();let x=e.offsetX/canvas.clientWidth;if(x<.5)left=true;else right=true;canvas.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(k=>canvas.addEventListener(k,()=>{left=false;right=false}));
function lineHit(b,a,d,e,f,power=0){let vx=e-a,vy=f-d,den=vx*vx+vy*vy,tt=Math.max(0,Math.min(1,((b.x-a)*vx+(b.y-d)*vy)/den)),px=a+tt*vx,py=d+tt*vy,nx=b.x-px,ny=b.y-py,dist=Math.hypot(nx,ny),radius=b.r+5;if(dist>=radius||dist<.0001)return false;nx/=dist;ny/=dist;b.x=px+nx*radius;b.y=py+ny*radius;let v=b.vx*nx+b.vy*ny;if(v<0){b.vx-=1.8*v*nx;b.vy-=1.8*v*ny}b.vx+=nx*power;b.vy+=ny*power;return true}
function physics(){if(!playing)return;for(const b of [...balls]){for(let sub=0;sub<3;sub++){b.vy+=.105;b.x+=b.vx/3;b.y+=b.vy/3;b.vx*=.9995;b.vy*=.9995;b.cool=Math.max(0,b.cool-1);if(b.x<49){b.x=49;b.vx=Math.abs(b.vx)*.86}if(b.x>402){b.x=402;b.vx=-Math.abs(b.vx)*.86}if(b.y<101){b.y=101;b.vy=Math.abs(b.vy)*.84}
for(const r of rails)lineHit(b,...r,1.1);
for(const p of [...bump,...posts]){let dx=b.x-p.x,dy=b.y-p.y,ds=Math.hypot(dx,dy);if(ds<p.r+b.r&&ds>.1){const nx=dx/ds,ny=dy/ds;b.x=p.x+nx*(p.r+b.r);b.y=p.y+ny*(p.r+b.r);let dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=1.9*dot*nx;b.vy-=1.9*dot*ny}b.vx+=nx*2.7;b.vy+=ny*2.7;if(!b.cool){award(bump.includes(p)?350:100,p.x,p.y,bump.includes(p)?'BUMPER!':'+100');b.cool=22}}}
const lEnd={x:left?217:207,y:left?620:680},rEnd={x:right?233:243,y:right?620:680};
if(lineHit(b,118,678,lEnd.x,lEnd.y,left?9:1)&&left){b.vy=-Math.max(11,Math.abs(b.vy)+5);b.vx=rng(1.7,6);if(!b.cool){award(50,b.x,b.y,'FLIP!');b.cool=15}}
if(lineHit(b,332,678,rEnd.x,rEnd.y,right?9:1)&&right){b.vy=-Math.max(11,Math.abs(b.vy)+5);b.vx=-rng(1.7,6);if(!b.cool){award(50,b.x,b.y,'FLIP!');b.cool=15}}
if(b.y>780){balls.splice(balls.indexOf(b),1);break}
b.vx=Math.max(-13,Math.min(13,b.vx));b.vy=Math.max(-22,Math.min(20,b.vy))}
}
if(!balls.length&&!ready){remaining--;update();combo=0;if(remaining<=0){playing=false;modal.hidden=false;modal.querySelector('h1').textContent='GAME OVER';modal.querySelector('p').innerHTML='SCORE FINAL : <b>'+score.toLocaleString('fr-FR')+'</b><br>Le Trône des Enfers attend ta revanche.';document.getElementById('play').textContent='REJOUER'}else{ready=true;texts.push({x:220,y:545,text:'LANCE LA BILLE',life:135});audio(100,.3)}}}
function stroke(x,y,x2,y2,w,color,blur=0){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.lineCap='round';c.lineWidth=w;c.strokeStyle=color;c.shadowColor=color;c.shadowBlur=blur;c.stroke();c.shadowBlur=0}
function disk(x,y,r,color,glow=0){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=color;c.shadowColor=color;c.shadowBlur=glow;c.fill();c.shadowBlur=0}
function label(s,x,y,size,color,font='Georgia'){c.textAlign='center';c.font='900 '+size+'px '+font;c.fillStyle=color;c.fillText(s,x,y)}
function render(){clock++;c.clearRect(0,0,W,H);c.save();c.translate(shake?Math.sin(clock*3)*shake:0,0);shake*=.88;
let wood=c.createLinearGradient(0,0,450,760);wood.addColorStop(0,'#280a12');wood.addColorStop(.5,'#0b1018');wood.addColorStop(1,'#200b13');c.fillStyle=wood;c.fillRect(0,0,W,H);
for(let i=0;i<38;i++)stroke(0,i*24,450,i*24-145,1,i%3===0?'#ff7f1a13':'#ffffff08');
c.fillStyle='#08080e';c.beginPath();c.moveTo(38,84);c.lineTo(412,84);c.lineTo(412,610);c.lineTo(334,723);c.lineTo(116,723);c.lineTo(38,610);c.closePath();c.fill();c.strokeStyle='#955027';c.lineWidth=15;c.shadowColor='#fa6b1a';c.shadowBlur=12;c.stroke();c.shadowBlur=0;
c.strokeStyle='#eea05b';c.lineWidth=3;c.stroke();stroke(51,101,399,101,2,'#e53d24',18);
for(let i=0;i<5;i++){c.beginPath();c.ellipse(225,240,160-i*15,125-i*12,-.02,Math.PI*1.08,Math.PI*1.94);c.lineWidth=i%2?5:8;c.strokeStyle=i%2?'#ff4e25':'#a4fc37';c.shadowColor=c.strokeStyle;c.shadowBlur=16;c.stroke();c.shadowBlur=0}
label('☠',225,163,57,'#ce9c6f');label('HELLXBONE',225,197,21,'#f2c09a');label('THRONE OF HELL',225,219,12,'#e77848','system-ui');
for(let i=0;i<8;i++){const x=77+i*43;stroke(x,404+Math.sin(i)*17,x+23,383+Math.sin(i)*17,9,i%2?'#5efa38':'#ed5736',12)}
for(let i=0;i<3;i++){let x=125+i*101;disk(x,130,13,'#692420',15);disk(x,130,7,i===1?'#adff4f':'#ffad42',9)}
for(const b of bump){disk(b.x+2,b.y+5,b.r+9,'#000');disk(b.x,b.y,b.r+6,b.col,18);disk(b.x,b.y,b.r,'#7f5b35');disk(b.x,b.y,b.r-7,'#17131a');c.beginPath();c.arc(b.x,b.y,b.r-3,0,Math.PI*2);c.lineWidth=3;c.strokeStyle='#fff1b3';c.stroke();label(b.label,b.x,b.y+5,b.label.length>2?12:24,'#ceff8c','system-ui')}
for(const p of posts){disk(p.x,p.y,p.r+6,'#ff622c',13);disk(p.x,p.y,p.r,'#553121');disk(p.x,p.y,6,'#ffd989',10)}
for(const r of rails){stroke(...r,12,'#371c20');stroke(...r,4,'#da7839',7);stroke(r[0],r[1]-2,r[2],r[3]-2,1.5,'#ffe7ae')}
for(let i=0;i<2;i++){const x=i?357:93;disk(x,535,29,'#65171b',12);disk(x,535,22,'#bc4237');disk(x,535,16,'#1a0911');label('☠',x,542,23,'#ffc38d')}
label('666',225,472,55,'#e5b16e');label(multitimer>0?'MULTIBALL INFERNAL':'CHAOS  •  JACKPOT',225,502,14,'#a8ff71','system-ui');if(multitimer>0)multitimer--;
for(let i=0;i<12;i++){let x=72+(i*113)%302,y=343+Math.floor(i/4)*64;disk(x,y,3,i%3?'#ff8a37':'#a8ff55',9)}
const le={x:left?217:207,y:left?620:680},re={x:right?233:243,y:right?620:680};
for(const f of [[118,678,le.x,le.y,left],[332,678,re.x,re.y,right]]){stroke(f[0],f[1]+3,f[2],f[3]+3,25,'#030304');stroke(f[0],f[1],f[2],f[3],19,f[4]?'#fdad55':'#9e4937',12);stroke(f[0],f[1]-3,f[2],f[3]-3,5,'#ffe4a5')}disk(118,678,13,'#6f3332');disk(332,678,13,'#6f3332');
for(const b of balls){disk(b.x,b.y,15,'#ff7b4433',18);let g=c.createRadialGradient(b.x-4,b.y-5,1,b.x,b.y,10);g.addColorStop(0,'#fff');g.addColorStop(.25,'#fff6dd');g.addColorStop(.6,'#bcc4d3');g.addColorStop(1,'#3d4555');disk(b.x,b.y,b.r,g,8)}
for(const p of particles){disk(p.x,p.y,2.5,'#ffce7f',7);p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life--}particles=particles.filter(x=>x.life>0);
for(const x of texts){c.globalAlpha=Math.min(1,x.life/25);label(x.text,x.x,x.y,18,'#f4e2a2','system-ui');x.y-=.6;x.life--}c.globalAlpha=1;texts=texts.filter(x=>x.life>0);
if(shimmer>0){c.fillStyle='rgba(250,104,34,'+(shimmer/180)+')';c.fillRect(0,0,W,H);shimmer--}c.restore()}
function frame(now){let dt=Math.min(50,now-last);last=now;accum+=dt;while(accum>=16.666){physics();accum-=16.666}render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
