<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELLXBONE — Test champion</title><style>body{font:16px system-ui;background:#120708;color:white;max-width:450px;margin:35px auto;padding:18px}input,button{display:block;box-sizing:border-box;width:100%;padding:13px;margin:10px 0;background:#240e0e;color:white;border:1px solid #f44;border-radius:8px}button{background:#9b201c;font-weight:bold}label{display:block;margin-top:12px}</style><h1>☠ TEST CHAMPION</h1><p>Test administrateur indépendant du classement. Vérification par code envoyé à Gmail obligatoire.</p><section id="login"><button id="request" type="button">Recevoir le code</button><input id="code" inputmode="numeric" placeholder="Code reçu par email"><button id="verify" type="button">Vérifier le code</button></section><form id="details" hidden><label>Nom et prénom<input name="full_name" required></label><label>Adresse<input name="address" required></label><label>Code postal<input name="postal_code" required></label><label>Ville<input name="city" required></label><label>Téléphone<input name="phone" type="tel" required></label><label><input type="checkbox" id="consent" required> J'accepte cet enregistrement de test.</label><button>Enregistrer dans Supabase</button></form><p id="status" role="status"></p><script src="hellx-winner-test-client.js"></script></html>
