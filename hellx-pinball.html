<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080b0b"><title>FLIPPER DE L'ENFER — HELLXBONE</title><style>
*{box-sizing:border-box}body{margin:0;background:#070909;color:#effbe9;font-family:system-ui,Arial;text-align:center}header{padding:12px;background:#121915;border-bottom:2px solid #9dff68}h1{font-size:clamp(22px,6vw,36px);margin:3px;color:#a8ff72}a{color:#baff80}main{max-width:540px;margin:auto;padding:8px}.hud{display:flex;justify-content:space-around;background:#141b17;border:1px solid #507042;padding:10px;border-radius:12px;margin:8px 0;font-size:14px}.hud strong{color:#adff69;font-size:19px;display:block}canvas{width:min(100%,420px);height:auto;max-height:68dvh;aspect-ratio:420/650;background:#0c1113;border:3px solid #8cff50;border-radius:18px;display:block;margin:auto;touch-action:none;box-shadow:0 0 30px #315827}button{border:1px solid #9dff61;border-radius:12px;background:#a8ff6d;color:#071006;padding:14px;font-size:17px;font-weight:850;touch-action:none;cursor:pointer}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.controls button{min-height:64px}.controls button:active,.controls button.pressed{background:#fff3a8}#start{width:100%;margin:8px 0}p{color:#c7d4c6;font-size:13px;line-height:1.5}#message{min-height:20px;color:#d9ffb6;font-weight:750}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><header><a href="./index.html">← Retour aux jeux</a><h1>☠ FLIPPER DE L'ENFER ☠</h1></header><main><div class="hud"><div>SCORE<strong id="score">0</strong></div><div>BALLES<strong id="balls">3</strong></div><div>RECORD<strong id="best">0</strong></div></div><canvas id="table" width="420" height="650" aria-label="Flipper metal à deux batteurs"></canvas><div class="controls"><button id="left">◀ BATTEUR GAUCHE</button><button id="right">BATTEUR DROIT ▶</button></div><button id="start">▶ LANCER LA PARTIE / BILLE</button><div id="message" role="status">Lance une bille puis utilise les deux batteurs.</div><p>3 billes • +100 par bumper • +500 par cible • Commandes tactiles, souris ou clavier (flèches gauche/droite). Le record est mémorisé sur cet appareil.</p></main>
<script>
(()=>{'use strict';const c=document.getElementById('table'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let score=0,balls=3,best=Number(localStorage.getItem('hellx-pinball-best')||0),active=false,gameOver=false,last=0;let ball={x:350,y:540,vx:0,vy:0,r:9},hold={left:false,right:false};const bumpers=[{x:128,y:205,r:31},{x:274,y:215,r:31},{x:207,y:325,r:28}],targets=[{x:86,y:370,r:14},{x:330,y:373,r:14}];$('best').textContent=best.toLocaleString('fr-FR');
function hud(){$('score').textContent=score.toLocaleString('fr-FR');$('balls').textContent=balls;if(score>best){best=score;localStorage.setItem('hellx-pinball-best',String(best));$('best').textContent=best.toLocaleString('fr-FR')}}
function message(s){$('message').textContent=s}
function launch(){if(active)return;if(gameOver){score=0;balls=3;gameOver=false;hud()}if(balls<=0)return;ball={x:355,y:515,vx:-2.3-Math.random()*1.3,vy:-13,r:9};active=true;message('À toi de jouer !')}
function drain(){active=false;balls--;hud();if(!balls){gameOver=true;message('GAME OVER — Score final : '+score.toLocaleString('fr-FR'));$('start').textContent='↻ REJOUER'}else{message('Bille perdue ! Lance la suivante.');$('start').textContent='▶ LANCER LA BILLE'}}
function hitCircle(p,bonus){const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),limit=p.r+ball.r;if(d>=limit)return;const nx=d>0?dx/d:0,ny=d>0?dy/d:-1;ball.x=p.x+nx*(limit+1);ball.y=p.y+ny*(limit+1);const dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny}ball.vx+=nx*1.2;ball.vy+=ny*1.2;score+=bonus;hud()}
function segment(ax,ay,bx,by,isFlipper){let dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((ball.x-ax)*dx+(ball.y-ay)*dy)/(dx*dx+dy*dy)));const px=ax+t*dx,py=ay+t*dy,d=Math.hypot(ball.x-px,ball.y-py);if(d>ball.r+8||ball.vy<0)return;ball.y=py-ball.r-9;ball.vy=-Math.max(8,Math.abs(ball.vy)*.94)-(isFlipper?4.5:0);ball.vx+=(ball.x-(ax+bx)/2)*.045;score+=isFlipper?25:0;hud()}
function flippers(){return [{a:[103,563],b:hold.left?[197,516]:[193,580],on:hold.left},{a:[317,563],b:hold.right?[223,516]:[227,580],on:hold.right}]}
function physics(dt){if(!active)return;const n=Math.max(1,Math.ceil(dt/0.75));for(let i=0;i<n;i++){const k=dt/n;ball.vy+=.24*k;ball.x+=ball.vx*k;ball.y+=ball.vy*k;if(ball.x<ball.r+18){ball.x=ball.r+18;ball.vx=Math.abs(ball.vx)*.9}if(ball.x>402-ball.r){ball.x=402-ball.r;ball.vx=-Math.abs(ball.vx)*.9}if(ball.y<ball.r+19){ball.y=ball.r+19;ball.vy=Math.abs(ball.vy)*.9}if(ball.y>650){drain();return}if(ball.y>550&&ball.x>170&&ball.x<250&&ball.vy>0&&!hold.left&&!hold.right){/* gap de sortie */}for(const p of bumpers)hitCircle(p,100);for(const p of targets)hitCircle(p,500);for(const f of flippers())segment(...f.a,...f.b,f.on);ball.vx=Math.max(-11,Math.min(11,ball.vx));ball.vy=Math.max(-17,Math.min(17,ball.vy))}}
function draw(){ctx.clearRect(0,0,420,650);let g=ctx.createLinearGradient(0,0,420,650);g.addColorStop(0,'#202827');g.addColorStop(.6,'#090e12');g.addColorStop(1,'#251016');ctx.fillStyle=g;ctx.fillRect(0,0,420,650);ctx.strokeStyle='#4fbc4b';ctx.lineWidth=5;ctx.strokeRect(15,14,390,622);ctx.textAlign='center';ctx.font='bold 24px system-ui';ctx.fillStyle='#a8ff67';ctx.fillText('HELLXBONE',210,82);ctx.font='15px system-ui';ctx.fillStyle='#bdcdb8';ctx.fillText('PINBALL • 666',210,108);for(const p of bumpers){ctx.beginPath();ctx.arc(p.x,p.y,p.r+5,0,Math.PI*2);ctx.fillStyle='#3a1324';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#f64b62';ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,p.r-8,0,Math.PI*2);ctx.fillStyle='#8d233f';ctx.fill();ctx.font='bold 23px system-ui';ctx.fillStyle='#fff';ctx.fillText('☠',p.x,p.y+8)}for(const p of targets){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='#a6ff56';ctx.fill()}ctx.strokeStyle='#ce3259';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(18,455);ctx.lineTo(105,540);ctx.moveTo(402,455);ctx.lineTo(315,540);ctx.stroke();for(const f of flippers()){ctx.beginPath();ctx.moveTo(...f.a);ctx.lineTo(...f.b);ctx.strokeStyle=f.on?'#eaffaa':'#a6ff5d';ctx.lineWidth=18;ctx.lineCap='round';ctx.stroke()}if(active){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff5cb';ctx.shadowColor='#f5ffbd';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0}else{ctx.fillStyle='#e3efd4';ctx.font='bold 19px system-ui';ctx.fillText(gameOver?'GAME OVER':'PRÊT À JOUER',210,435)}}
function frame(ts){let dt=last?Math.min(2,(ts-last)/16.667):1;last=ts;physics(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('start').addEventListener('click',launch);function bind(id,side){const el=$(id);function set(v){hold[side]=v;el.classList.toggle('pressed',v)}el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);set(true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>set(false))}
bind('left','left');bind('right','right');addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')hold.left=true;if(e.key==='ArrowRight')hold.right=true;if(e.key===' '&&!e.repeat)launch()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')hold.left=false;if(e.key==='ArrowRight')hold.right=false});addEventListener('blur',()=>{hold.left=false;hold.right=false});c.addEventListener('pointerdown',e=>{e.preventDefault();const rect=c.getBoundingClientRect();const side=(e.clientX-rect.left)<rect.width/2?'left':'right';hold[side]=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',()=>{hold.left=hold.right=false});c.addEventListener('pointercancel',()=>{hold.left=hold.right=false});})();
</script></body></html>
