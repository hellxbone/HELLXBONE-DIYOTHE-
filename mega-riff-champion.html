<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Champion MEGA RIFF — HELLXBONE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#271523,#080808 70%);font-family:system-ui,Arial;color:#fff;display:flex;align-items:center;justify-content:center;padding:18px}.veil{position:fixed;inset:0;background:rgba(0,0,0,.55)}.modal{position:relative;width:min(100%,490px);max-height:96vh;overflow:auto;border:2px solid #8af75e;border-radius:20px;background:linear-gradient(155deg,#181818,#070707);box-shadow:0 0 75px #63e64d42;padding:24px;text-align:center}small{letter-spacing:3px;color:#a2fc75;font-weight:800}h1{font-size:clamp(30px,8vw,48px);margin:12px 0;line-height:1.05}p{line-height:1.5}.card{position:relative;border:2px solid #a2fc75;border-radius:16px;background:linear-gradient(140deg,#303b29,#080a08 55%,#242424);margin:22px auto;padding:24px 14px;box-shadow:0 12px 40px #000;aspect-ratio:1.6;display:flex;flex-direction:column;justify-content:space-between;gap:12px}.logo{font-weight:1000;font-size:clamp(22px,7vw,38px);letter-spacing:1px;color:white;text-shadow:2px 3px #247d20}.label{font-size:11px;letter-spacing:2px;color:#acf18d}.name{font-size:clamp(24px,7vw,38px);font-weight:900;overflow-wrap:anywhere}.number{font:700 16px monospace;color:#adff92}.score{font-size:29px;color:#b6fb96;font-weight:900}.btn{display:block;background:#a1fa74;color:#080808;text-decoration:none;padding:14px;margin-top:20px;border-radius:12px;font-weight:900}.hint{font-size:12px;color:#aaa}</style></head><body><div class="veil"></div><main class="modal" role="dialog" aria-modal="true" aria-labelledby="congrats"><small>HELLXBONE CLUB • MEGA RIFF</small><h1 id="congrats">FÉLICITATIONS !</h1><p>La Horde salue son champion <strong id="month"></strong> !</p><div class="card"><div class="logo">HELLXBONE<br><span style="color:#a1fa74">CLUB</span></div><div><div class="label">CARTE DE MEMBRE • CHAMPION</div><div class="name" id="winner">—</div><div class="number" id="member">MEMBRE HELLXBONE</div></div></div><div class="label">SCORE VICTORIEUX</div><div class="score" id="score">—</div><a class="btn" href="./index.html?game=mega-riff">RETOUR À MEGA RIFF</a><p class="hint">La carte ci-dessus est une présentation du membre gagnant.</p></main><script>(()=>{const p=new URLSearchParams(location.search);const name=(p.get('winner')||'').slice(0,70),score=Number(p.get('score')),member=(p.get('member')||'').slice(0,20),month=(p.get('month')||'').slice(0,7);const el=id=>document.getElementById(id);if(!name||!Number.isFinite(score)||score<0||!/^[0-9]{4}-[0-9]{2}$/.test(month)){el('congrats').textContent='CHAMPION MEGA RIFF';el('month').textContent='';return}el('winner').textContent=name;el('score').textContent=Math.floor(score).toLocaleString('fr-FR')+' POINTS';el('member').textContent=/^HX-[0-9]{6,}$/.test(member)?'N° '+member:'MEMBRE HELLXBONE';let d=new Date(month+'-01T12:00:00Z');el('month').textContent='de '+d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});})();</script></body></html>
